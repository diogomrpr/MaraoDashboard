hc_washing_machine_card:
  template: hc_single_title_card
  name: Máquina Roupa
  show_label: true
  icon: mdi:washing-machine
  entity: binary_sensor.maquina_roupa
  tap_action:
    action: none
  hold_action:
    action: none
  double_tap_action:
    action: none
  styles:
    card:
      - padding: 16px 20px
      - font-family: montserrat
    grid:
      - grid-template-areas: |
          'i state'
          'n time'
      - grid-template-columns: 1fr 1fr
      - grid-template-rows: 48px min-content
    name:
      - justify-self: start
      - font-size: 18px
      - font-weight: 700
    # label:
    #   - justify-self: start
    #   - font-size: 16px
    #   - font-weight: 500
    icon:
      - width: 68%
    img_cell:
      - justify-self: start
      - align-self: center
      - width: 48px
      - height: 48px
      - padding-bottom: 0
      - border-radius: 50%
      - background: var(--button-card-background)
    custom_fields:
      state:
        - justify-self: end
        - align-self: end
        - padding-bottom: 6px
        - font-size: 18px
        - font-weight: 500
      time:
        - justify-self: end
        - font-size: 18px
        - font-weight: 500
  custom_fields:
    state: |
      [[[
        var s = states[entity.entity_id].state;
        return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
      ]]]
    time: |
      [[[
        const e = states[entity.entity_id];
        if (!e || e.state !== 'on') return '';

        const started = new Date(e.last_changed).getTime();
        const now = Date.now();
        const totalMinutes = Math.max(0, Math.floor((now - started) / 60000));
        const h = Math.floor(totalMinutes / 60);
        const m = (totalMinutes % 60).toString().padStart(2, '0');

        return `${h}:${m}`;
      ]]]
