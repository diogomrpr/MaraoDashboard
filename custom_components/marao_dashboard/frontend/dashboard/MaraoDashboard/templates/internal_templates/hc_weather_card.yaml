hc_weather_card:
  template: hc_single_title_card
  show_name: true
  show_label: true
  show_icon: false
  show_state: false
  name: "[[[ return helpers.localize(states[entity.entity_id]) ]]]"
  show_last_changed: false
  label: |
    [[[
      const temperature = states[entity.entity_id]?.attributes?.temperature;
      return temperature == null ? '' : temperature + '°C';
    ]]]
  variables:
    label_left: |
      [[[
        const today = new Date(); 
        return `${today.toLocaleString('en-US', { month: 'long', day: 'numeric' })}`;
      ]]]
    label_right: ""
    show_forecast: true
  triggers_update: all
  styles:
    grid:
      - grid-template-areas: |
          "label_left label_right"
          "weather_icon n"
          "weather_icon l"
          "f f"
      - grid-template-columns: 1fr 1fr
      - grid-template-rows: repeat(4, min-content)
    card:
      - padding: 15px
      - background: |
          [[[ 
            if (!entity || !entity.state) return variables.var_card_color;
            const weather = entity.state.toLowerCase();
            const assetPath = window.MaraoDashboard?.assetPath || variables.marao_dashboard_asset_path || '/local/images';
            const gradientMap = {
              sunny: 'var(--weather-sunny-background)',
              'clear-night': 'var(--weather-clear-night-background)',
              clear: 'var(--weather-clear-background)',
              partlycloudy: 'var(--weather-cloudy-background)',
              cloudy: 'var(--weather-cloudy-background)',
              fog: 'var(--weather-cloudy-background)',
              rainy: 'var(--weather-rain-background)',
              pouring: 'var(--weather-rain-background)',
              lightning: 'var(--weather-storm-background)',
              'lightning-rainy': 'var(--weather-storm-background)',
              windy: 'var(--weather-cloudy-background)',
              snowy: 'var(--weather-cloudy-background)',
              'snowy-rainy': 'var(--weather-rain-background)',
              hail: 'var(--weather-storm-background)',
            };
            if 
              (weather in gradientMap) return 'center / cover no-repeat url(' + assetPath + '/weather/bg-' + weather + '.svg), ' + gradientMap[weather]
            else
              return variables.var_card_color;            
          ]]]
    name:
      - text-align: left
      - font-size: 30px
      - font-weight: 400
      - justify-self: start
      - align-self: end
      - color: var(--active-text-color)
      - margin-left: 30px
      - text-wrap: wrap
      - z-index: 1
    label:
      - text-align: left
      - font-size: 35px
      - font-weight: 800
      - justify-self: start
      - align-self: start
      - margin-left: 30px
      - color: var(--active-text-color)
      - z-index: 1
    custom_fields:
      f:
        - display:  "[[[ return variables.show_forecast ? '' : 'none' ]]]"
      weather_icon:
         - z-index: 1
      gradient_overlay:
        - background: var(--weather-card-overlay)
        - width: 100%
        - height: 100%
        - position: absolute
        - opacity: 0.4
        - left: 0
        - top: 0
        - z-index: 0
  custom_fields:
    gradient_overlay: ''
    weather_icon: |
      [[[
        const style = `
          <style>
            .center {
              display: block;
              margin-left: auto;
              margin-right: auto;
              width: 120px;
              height: 120px;
            }
          </style>`
        if (!entity || !entity.state) return 'mdi:help-circle-outline';
        const weather = entity.state.toLowerCase();
        const assetPath = window.MaraoDashboard?.assetPath || variables.marao_dashboard_asset_path || '/local/images';
        return style + '<img src = "' + assetPath + '/weather/' + weather + '.svg" class="center"/> ' || 'mdi:help-circle-outline'
      ]]]
    f:
      card:
        type: custom:button-card
        entity: "[[[ return entity.entity_id ]]]"
        show_name: false
        show_icon: false
        show_state: false
        styles:
          grid:
            - grid-template-areas: |
                "day1 day2 day3"
            - grid-template-columns: 1fr 1fr 1fr
          card:
            - padding: 0
            - padding-top: 10px
            - background: none
            - box-shadow: none
            - border-style: none
            - overflow: visible
        custom_fields:
          day1:
            card:
              type: custom:button-card
              entity: "[[[ return entity.entity_id ]]]"
              label: |-
                [[[
                  const item = states[entity.entity_id]?.attributes?.forecast?.[1] || {};
                  return item.temperature == null ? '' : item.temperature + "<span style>°C</span>"
                ]]]
              name: |
                [[[ 
                  const day = states[entity.entity_id]?.attributes?.forecast?.[1]?.datetime;
                  return day ? helpers.formatDateWeekdayShort(day) : '';
                ]]]
              show_label: true
              show_icon: false
              styles: &styles
                grid:
                  - grid-template-areas: |
                      "n n" 
                      "icon icon" 
                      "l l" 
                      "temp temp" 
                      "templow templow" 
                      "precip precip"
                  - grid-template-rows: min-content
                card:
                  - font-family: montserrat
                  - border-style: none
                  - background: none
                  - padding: 0
                  - overflow: visible
                  - box-shadow: none
                name:
                  - font-weight: 800
                  - opacity: 0.9
                  - font-size: 18px
                  - color: var(--active-text-color)
                custom_fields:
                  icon:
                    - width: 20px
                    - height: auto
                    - overflow: visible
                    - justify-self: center
                    - margin-bottom: -5px
                    - color: var(--active-text-color)
                    - margin-right: 7px
                  img_cell:
                    - overflow: visible
                  precip:
                    - font-weight: 400
                    - opacity: 0.9
                    - color: var(--active-text-color)
                    - font-size: 18px
                  temp:
                    - font-weight: 700
                    - opacity: 0.9
                    - color: var(--active-text-color)
                    - font-size: 18px
                    - padding-bottom: 5px
                  templow:
                    - font-weight: 400
                    - opacity: 0.9
                    - color: var(--active-text-color)
                    - font-size: 18px
              custom_fields:
                icon: |
                  [[[
                    const weather = states[entity.entity_id]?.attributes?.forecast?.[1]?.condition || entity.state;
                    const assetPath = window.MaraoDashboard?.assetPath || variables.marao_dashboard_asset_path || '/local/images';
                    return '<img src = "' + assetPath + '/weather/' + weather + '.svg" class="color-white-svg" />'
                  ]]]
                temp: |
                  [[[ 
                    const value = states[entity.entity_id]?.attributes?.forecast?.[1]?.temperature;
                    return value == null ? '' : value + "<span style>°C</span>" ;
                  ]]]  
                templow: |
                  [[[ 
                    const value = states[entity.entity_id]?.attributes?.forecast?.[1]?.templow;
                    return value == null ? '' : value + "<span style>°C</span>" ;
                  ]]]  
                precip: |
                  [[[ 
                    const value = states[entity.entity_id]?.attributes?.forecast?.[1]?.precipitation;
                    return value == null ? '' : value + "<span style> mm</span>" ;
                  ]]]
          day2:
            card:
              type: custom:button-card
              entity: "[[[ return entity.entity_id ]]]"
              label: |-
                [[[
                  const item = states[entity.entity_id]?.attributes?.forecast?.[2] || {};
                  return item.temperature == null ? '' : item.temperature + "<span style>°C</span>"
                ]]]
              name: |
                [[[ 
                  const day = states[entity.entity_id]?.attributes?.forecast?.[2]?.datetime;
                  return day ? helpers.formatDateWeekdayShort(day) : '';
                ]]]
              show_label: true
              show_icon: false
              styles: *styles
              custom_fields:
                icon: |
                  [[[
                    const weather = states[entity.entity_id]?.attributes?.forecast?.[2]?.condition || entity.state;
                    const assetPath = window.MaraoDashboard?.assetPath || variables.marao_dashboard_asset_path || '/local/images';
                    return '<img src = "' + assetPath + '/weather/' + weather + '.svg" class="color-white-svg" />'
                  ]]]
                temp: |
                  [[[ 
                    const value = states[entity.entity_id]?.attributes?.forecast?.[2]?.temperature;
                    return value == null ? '' : value + "<span style>°C</span>" ;
                  ]]]  
                templow: |
                  [[[ 
                    const value = states[entity.entity_id]?.attributes?.forecast?.[2]?.templow;
                    return value == null ? '' : value + "<span style>°C</span>" ;
                  ]]]  
                precip: |
                  [[[ 
                    const value = states[entity.entity_id]?.attributes?.forecast?.[2]?.precipitation;
                    return value == null ? '' : value + "<span style> mm</span>" ;
                  ]]]
          day3:
            card:
              type: custom:button-card
              entity: "[[[ return entity.entity_id ]]]"
              label: |-
                [[[
                  const item = states[entity.entity_id]?.attributes?.forecast?.[3] || {};
                  return item.temperature == null ? '' : item.temperature + "<span style>°C</span>"
                ]]]
              name: |
                [[[ 
                  const day = states[entity.entity_id]?.attributes?.forecast?.[3]?.datetime;
                  return day ? helpers.formatDateWeekdayShort(day) : '';
                ]]]
              show_label: true
              show_icon: false
              styles: *styles
              custom_fields:
                icon: |
                  [[[
                    const weather = states[entity.entity_id]?.attributes?.forecast?.[3]?.condition || entity.state;
                    const assetPath = window.MaraoDashboard?.assetPath || variables.marao_dashboard_asset_path || '/local/images';
                    return '<img src = "' + assetPath + '/weather/' + weather + '.svg" class="color-white-svg" />'
                  ]]]
                temp: |
                  [[[ 
                    const value = states[entity.entity_id]?.attributes?.forecast?.[3]?.temperature;
                    return value == null ? '' : value + "<span style>°C</span>" ;
                  ]]]  
                templow: |
                  [[[ 
                    const value = states[entity.entity_id]?.attributes?.forecast?.[3]?.templow;
                    return value == null ? '' : value + "<span style>°C</span>" ;
                  ]]]  
                precip: |
                  [[[ 
                    const value = states[entity.entity_id]?.attributes?.forecast?.[3]?.precipitation;
                    return value == null ? '' : value + "<span style> mm</span>" ;
                  ]]]
    label_left:
      card:
        type: custom:button-card
        show_label: true
        label: "[[[ return variables.label_left ]]]"
        styles:
          card:
            - padding: 0
            - background: none
            - box-shadow: none
            - border-radius: none
            - padding-left: 10px
            - border-style: none
          label:
            - align-self: start
            - justify-self: start
            - font-size: 18px
            - font-weight: 500
            - font-family: montserrat
            - color: var(--active-text-color)
    label_right:
      card:
        type: custom:button-card
        show_label: true
        label: "[[[ return variables.label_right ]]]"
        styles:
          card:
            - padding: 0
            - background: none
            - box-shadow: none
            - padding-right: 10px
            - border-radius: none
            - border-style: none
          label:
            - align-self: start
            - justify-self: end
            - font-size: 18px
            - font-weight: 500
            - font-family: montserrat
            - color: var(--active-text-color)
