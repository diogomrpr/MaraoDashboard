hc_fan_card:
  template: hc_single_title_card
  icon: marao_dashboard:fan-fill
  variables:
    enable_slider: false
    card_color: var(--primary-color)
    custom_label: ""
  label: |
    [[[
      if (states[entity.entity_id].attributes.percentage && states[entity.entity_id].state === 'on') {
        var speed = states[entity.entity_id].attributes.percentage;
        return variables.custom_label + (speed ? speed + '%': (window.MaraoDashboard?.localize?.('common.off', hass) || 'Off'));
      }
      else {
        return variables.custom_label + states[entity.entity_id].state;
      }
    ]]]
  show_name: true
  show_icon: true
  show_label: true
  show_state: false
  styles:
    grid:
      - grid-template-areas: |
          [[[
            if (variables.enable_slider) {
                return '"n i" "l i" "slider slider"';
            }
              return '"n i" "l i"';
          ]]]
      - grid-template-columns: minmax(0, 1fr) 56px
      - grid-template-rows: min-content min-content min-content
      - align-content: center
      - column-gap: 12px
      - row-gap: 3px
    card:
      - padding: 12px
      - min-height: 100px
    name:
      - text-align: left
      - font-size: 18px
      - font-weight: 700
      - justify-self: start
      - align-self: end
    label:
      - text-align: left
      - color: var(--subtext-color)
      - font-weight: 500
      - font-size: 16px
      - justify-self: start
      - align-self: start
      - padding-bottom: |
          [[[
            if (variables.enable_slider) {
                return '10px';
            }
              return '0';
          ]]]
    icon:
      - width: 68%
      - color: var(--active-text-color)
    img_cell:
      - background: var(--opacity-contrast-100)
      - border-radius: 50%
      - width: 56px
      - height: 56px
      - align-self: center
    custom_fields:
      slider:
        - display: >
            [[[
              if (variables.enable_slider) {
                  return "block";
              }
              return "none";
            ]]]
  state:
    - value: "on"
      icon: marao_dashboard:fan-fill
      styles:
        card:
          - background: "[[[ return variables.card_color ]]]"
        name:
          - color: var(--active-text-color)
        label:
          - color: var(--active-text-color)
        state:
          - color: var(--active-text-color)
        icon:
          - animation: spin 3s linear infinite;
    - value: "off"
      styles:
        icon:
          - color: var(--icon-color)
        img_cell:
          - background: var(--background-icon-color-default)
    - value: "unavailable"
      styles:
        name:
          - text-decoration: line-through
        icon:
          - color: var(--icon-color)
        img_cell:
          - background: var(--background-icon-color-default)
        card:
          - opacity: 0.6
          - pointer-events: none
      label: "[[[ return window.MaraoDashboard?.localize?.('common.unknown', hass) || 'Unknown' ]]]"
      icon: marao_dashboard:fan
  extra_styles: |
    @keyframes spin {
      from {
          transform:rotate(0deg);
      }
      to {
          transform:rotate(360deg);
      }
    }
  custom_fields:
    slider:
      card:
        type: custom:my-slider-v2
        entity: "[[[ return entity.entity_id ]]]"
        styles:
          card:
            - height: 30px
            - box-shadow: none
            - padding: 0
            - touch-action: pan-y
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'off') {
                    return 'var(--background)';
                  } else {
                    return variables.card_color;
                  }
                ]]]
            - border-radius: 10px
          progress:
            - height: 100%
            - touch-action: pan-y
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'off') {
                    return variables.card_color;
                  } else {
                    return 'var(--active-text-color)';
                  }
                ]]]
            - border-radius: 10px
          track:
            - touch-action: pan-y
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'on') {
                    return 'var(--opacity-contrast-100)';
                  } else {
                    return 'var(--slider-color)';
                  }
                ]]]

            - border-radius: 10px
          thumb:
            - touch-action: pan-y
            - height: 30%
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'off') {
                    return 'var(--active-text-color)';
                  } else {
                    return variables.card_color;
                  }
                ]]]
            - position: absolute
            - right: 7px
            - top: 11px
            - width: 3px
  hold_action:
    action: more-info
    haptic: heavy
