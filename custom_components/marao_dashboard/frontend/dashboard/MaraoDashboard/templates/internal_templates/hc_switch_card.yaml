hc_switch_card:
  template: hc_single_title_card
  variables:
    power_entity:
    power_unit: w
    active_color: var(--color-green)
    graph_color: var(--active-text-color)
    show_graph: false
    show_graph_line: true
    show_graph_fill: false
  show_state: true
  styles:
    grid:
      - grid-template-areas: |
          'n i'
          's i'
          'graph graph'
      - grid-template-columns: minmax(0, 1fr) 56px
      - grid-template-rows: min-content min-content min-content
      - align-content: center
      - column-gap: 12px
      - row-gap: 4px
    card:
      - padding: 12px
      - min-height: 100px
    name:
      - text-align: left
      - font-weight: 700
      - justify-self: start
      - align-self: end
      - font-size: 18px
    state:
      - text-align: left
      - font-size: var(--font-size-state)
      - font-weight: 500
      - justify-self: start
      - align-self: start
      - color: var(--subtext-color)
    icon:
      - width: 68%
      - color: var(--active-text-color)
    img_cell:
      - background: var(--opacity-contrast-100)
      - border-radius: 50%
      - width: 56px
      - height: 56px
      - align-self: center
    custom_fields:
      graph:
        - display: |
            [[[
              if (variables.show_graph) {
                return 'block';
              }
              else {
                return 'none';
              }
            ]]]
        - position: absolute
        - left: 0
        - bottom: -1px
        - width: 100%
        - z-index: 1
        - pointer-events: none
  state:
    - value: "on"
      styles:
        card:
          - background: "[[[ return variables.active_color ]]]"
        name:
          - color: var(--active-text-color)
        label:
          - color: var(--active-text-color)
        state:
          - color: var(--active-text-color)
      state_display: |
        [[[
          if (entity.state === "on" && variables.power_entity !== null) {
            return states[entity.entity_id].state + " - " + states[variables.power_entity].state + variables.power_unit;
          } else {
            return states[entity.entity_id].state;
          }
        ]]]
    - value: "off"
      styles:
        icon:
          - color: var(--icon-color-default)
        img_cell:
          - background: var(--background-icon-color-default)
    - value: unavailable
      styles:
        name:
          - text-decoration: line-through
        icon:
          - color: var(--icon-color-default)
        img_cell:
          - background: var(--background-icon-color-default)
        card:
          - opacity: 0.6
          - pointer-events: none
  custom_fields:
    graph:
      card:
        type: custom:mini-graph-card
        entities:
          - entity: "[[[ return variables.power_entity || entity.entity_id ]]]"
            show_fill: "[[[ return variables.show_graph_fill ]]]"
            show_line: "[[[ return variables.show_graph_line ]]]"
        animate: true
        show:
          name: false
          icon: false
          state: false
        line_width: 1
        line_color: |
          [[[
            if (entity.state === "on" && variables.power_entity !== null) {
              return variables.graph_color;
            } else {
              return 'var(--primary-color)';
            }
          ]]]
        hours_to_show: 24
        card_mod:
          style: |
            ha-card {
              background: none;
              box-shadow: none;
              --ha-card-border-width: 0;
              z-index: 1
            }
