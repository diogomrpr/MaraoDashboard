hc_cover_card:
  template: hc_single_title_card
  icon: mdi:window-shutter
  variables:
    card_color: var(--color-blue)
  label: |
    [[[
      var bri = entity.attributes.current_position;
      if (states[entity.entity_id].state === 'closing') {
        return window.MaraoDashboard?.localize?.('common.closing', hass) || 'Closing';
      }
      if (states[entity.entity_id].state === 'opening'){
        return window.MaraoDashboard?.localize?.('common.opening', hass) || 'Opening';
      }
      return ' ' + (bri
        ? bri + '% ' + (window.MaraoDashboard?.localize?.('common.open', hass) || 'Open')
        : (window.MaraoDashboard?.localize?.('common.closed', hass) || 'Closed'));
    ]]]
  show_name: true
  show_icon: true
  show_label: true
  show_state: false
  styles:
    grid:
      - grid-template-areas: |
          [[[ return '"n i" "l i" "slider slider"'; ]]]
      - grid-template-rows: min-content min-content 1fr
    card:
      - padding: 10px
    name:
      - text-align: left
      - font-size: 18px
      - font-family: Montserrat
      - font-weight: 700
      - justify-self: start
      - align-self: end
    label:
      - text-align: left
      - font-size: 16px
      - font-family: Montserrat
      - font-weight: 500
      - justify-self: start
      - align-self: center
      - opacity: 0.7
      - padding-bottom: |
          [[[
                return '10px';
          ]]]
    icon:
      - width: 62%
      - color: var(--active-text-color)
    img_cell:
      - background: var(--opacity-contrast-100)
      - padding: 6px
      - border-radius: 50%
      - width: 42px
      - height: 42px
      - align-self: start
      - margin-bottom: 10px
  state:
    - value: "open"
      icon: mdi:window-shutter-open
      styles:
        card:
          - background: "[[[ return variables.card_color ]]]"
        name:
          - color: var(--active-text-color)
        label:
          - color: var(--active-text-color)
        state:
          - color: var(--active-text-color)
    - value: "opening"
      icon: mdi:window-shutter-open
      styles:
        card:
          - background: "[[[ return variables.card_color ]]]"
        name:
          - color: var(--active-text-color)
        label:
          - color: var(--active-text-color)
        state:
          - color: var(--active-text-color)
    - value: "closing"
      icon: mdi:window-shutter-open
      styles:
        card:
          - background: "[[[ return variables.card_color ]]]"
        name:
          - color: var(--active-text-color)
        label:
          - color: var(--active-text-color)
        state:
          - color: var(--active-text-color)
    - value: "closed"
      styles:
        icon:
          - color: var(--icon-color-default)
        img_cell:
          - background: var(--background-icon-color-default)
    - value: "unavailable"
      styles:
        name:
          - text-decoration: line-through
        icon:
          - color: var(--icon-color-default)
        img_cell:
          - background: var(--background-icon-color-default)
        card:
          - opacity: 0.6
          - pointer-events: none
      label: "[[[ return window.MaraoDashboard?.localize?.('common.unknown', hass) || 'Unknown' ]]]"
      icon: mdi:help
  custom_fields:
    slider:
      card:
        type: custom:my-slider-v2
        entity: "[[[ return entity.entity_id ]]]"
        mode: position
        vertical: false
        flipped: false
        sliderMin: 4
        disableScroll: false
        styles:
          card:
            - height: 30px
            - box-shadow: none
            - padding: 0
            - touch-action: pan-y
            - background: "[[[ return variables.card_color ]]]"
          progress:
            - height: 100%
            - touch-action: pan-y
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'closed') {
                    return variables.card_color;
                  } else {
                    return 'var(--active-text-color)';
                  }
                ]]]
            - border-radius: 10px
          track:
            - touch-action: pan-y
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'open' || states[entity.entity_id].state === 'opening' || states[entity.entity_id].state === 'closing') {
                    return 'var(--opacity-contrast-100)';
                  } else {
                    return 'var(--slider-color)';
                  }
                ]]]

            - border-radius: 10px
          thumb:
            - touch-action: pan-y
            - height: 30%
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'closed') {
                    return 'var(--active-text-color)';
                  } else {
                    return variables.card_color;
                  }
                ]]]
            - position: absolute
            - right: 7px
            - top: 11px
            - width: 3px
  tap_action:
    action: call-service
    service: cover.toggle
    data:
      entity_id: |
        [[[ return entity.entity_id; ]]]
    haptic: heavy
  hold_action:
    action: more-info
    haptic: heavy
