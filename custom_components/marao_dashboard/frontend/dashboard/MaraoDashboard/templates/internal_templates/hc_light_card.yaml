hc_light_card:
  icon: mdi:lightbulb
  template: hc_base_card
  variables:
    enable_slider: |
      [[[
        if (states[entity.entity_id].attributes.brightness) {
          return true;
        } else {
          return false;
        }
      ]]]
  label: |
    [[[
      if (states[entity.entity_id].attributes.brightness) {
        var bri = (Math.round(states[entity.entity_id].attributes.brightness / 2.55));
        return variables.custom_label + (bri ? bri + '%': (window.MaraoDashboard?.localize?.('common.off', hass) || 'Off'));
      }
      else {
        return '';
      }
    ]]]
  styles:
    name:
      - text-align: left
      - font-size: 18px
      - font-weight: 500
      - justify-self: start
      - align-self: center
      - overflow: hidden
      - text-overflow: ellipsis
      - white-space: nowrap
    icon:
      - color: var(--active-text-color)
      - width: 68%
    grid:
      - grid-template-areas: |
          [[[
            if (variables.enable_slider && states[entity.entity_id].attributes.brightness) {
                return '"n i" "l i" "slider slider"';
            }
              return '"n i" "l i"';
          ]]]
      - grid-template-columns: minmax(0, 1fr) 56px
      - grid-template-rows: min-content min-content min-content
      - align-content: center
      - column-gap: 12px
      - row-gap: 3px
    img_cell:
      - width: 56px
      - height: 56px
      - margin-bottom: 0
      - align-self: center
    custom_fields:
      slider:
        - display: >
            [[[
              if (variables.enable_slider && states[entity.entity_id].attributes.brightness) {
                  return "block";
              }
              return "none";
            ]]]
  state:
    - value: "on"
      styles:
        card:
          - background: "[[[ return variables.card_color ]]]"
        name:
          - color: var(--active-text-color)
        label:
          - color: var(--active-text-color)
        state:
          - color: var(--active-text-color)
    - value: "off"
      styles:
        card:
          - background: var(--ha-card-background)
        icon:
          - color: var(--color-grey)
        img_cell:
          - background: var(--background-icon-color-default)
    - value: "unavailable"
      styles:
        name:
          - text-decoration: line-through
        icon:
          - color: var(--active-text-color)
        img_cell:
          - background: var(--background-icon-color-default)
        card:
          - opacity: 0.6
          - pointer-events: none
      label: "[[[ return window.MaraoDashboard?.localize?.('common.unknown', hass) || 'Unknown' ]]]"
      icon: mdi:lightbulb-question
  custom_fields:
    slider:
      card:
        type: custom:my-slider-v2
        entity: "[[[ return entity.entity_id ]]]"
        mode: brightness
        sliderMin: 4
        styles:
          card:
            - height: 30px
            - box-shadow: none
            - padding: 0
            - touch-action: pan-y
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'off') {
                    return 'var(--background)';
                  } else {
                    return variables.card_color;
                  }
                ]]]
            - border-radius: 12px
          progress:
            - height: 100%
            - touch-action: pan-y
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'off') {
                    return variables.card_color;
                  } else {
                    return 'var(--active-text-color)';
                  }
                ]]]
            - border-radius: 12px
          track:
            - touch-action: pan-y
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'on') {
                    return 'var(--opacity-contrast-100)';
                  } else {
                    return 'var(--slider-color)';
                  }
                ]]]

            - border-radius: 12px
          thumb:
            - touch-action: pan-y
            - height: 30%
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'off') {
                    return 'var(--active-text-color)';
                  } else {
                    return variables.card_color;
                  }
                ]]]
            - position: absolute
            - right: 7px
            - top: 11px
            - width: 3px
  hold_action:
    action: more-info
    haptic: heavy
