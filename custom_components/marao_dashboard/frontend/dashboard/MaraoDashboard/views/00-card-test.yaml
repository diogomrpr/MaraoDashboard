title: Card Test
path: card-test
icon: mdi:test-tube
cards:
  - type: vertical-stack
    cards:
      - type: custom:marao-card
        template: hc_header_card
        entity: sensor.marao_dashboard_test_weather
        variables:
          person_entity: person.test

      - type: custom:marao-card
        template: hc_title_card
        name: Marao Dashboard Card Test
        label: All Marao card templates
        variables:
          entity1: input_boolean.marao_dashboard_test_one
          entity1_name: One
          entity2: input_boolean.marao_dashboard_test_two
          entity2_name: Two
          entity3: input_boolean.marao_dashboard_test_three
          entity3_name: Three

      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_navigation_card
            name: Rooms page
            icon: mdi:sofa-outline
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /marao-dashboard/rooms
          - type: custom:marao-card
            template: hc_navigation_card
            name: Media page
            icon: mdi:television-play-outline
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /marao-dashboard/media

      - type: custom:marao-card
        template: hc_weather_card
        entity: sensor.marao_dashboard_test_weather
        variables:
          show_forecast: false

      - type: custom:marao-card
        template: hc_camera_card
        entity: camera.marao_dashboard_test_camera
        name: Camera + events
        variables:
          popup_hash: "#marao-dashboard-test-camera-popup"

      - type: custom:marao-card
        template: hc_glance_card
        variables:
          entity1: sensor.marao_dashboard_test_temperature
          entity1_name: Temp
          entity1_icon: mdi:thermometer
          entity2: sensor.marao_dashboard_test_humidity
          entity2_name: Humidity
          entity2_icon: mdi:water-percent
          entity3: sensor.marao_dashboard_test_power
          entity3_name: Power
          entity3_icon: mdi:flash

      - type: custom:marao-card
        template: hc_base_card
        entity: sensor.marao_dashboard_test_temperature
        name: Base card

      - type: custom:marao-card
        template: hc_light_card
        entity: light.marao_dashboard_test_light
        name: Light + slider

      - type: custom:marao-card
        template: hc_light_card
        entity: light.marao_dashboard_test_light
        name: Light without slider
        variables:
          enable_slider: false

      - type: custom:marao-card
        template: hc_cover_card
        entity: cover.marao_dashboard_test_cover
        name: Cover + slider

      - type: custom:marao-card
        template: hc_access_card
        entity: lock.marao_dashboard_test_lock
        name: Lock access
        variables:
          popup_hash: "#marao-dashboard-test-lock-popup"

      - type: custom:marao-card
        template: hc_access_card
        entity: cover.marao_dashboard_test_garage_door
        name: Garage door access
        variables:
          popup_hash: "#marao-dashboard-test-garage-door-popup"

      - type: custom:marao-card
        template: hc_access_action_card
        entity: cover.marao_dashboard_test_open_only_door
        name: Open-only door
        icon: mdi:door-open
        variables:
          action_service: cover.open_cover
          action_label_key: common.open
          action_color: var(--color-red)

      - type: vertical-stack
        cards:
          - type: custom:marao-card
            template: hc_switch_card
            entity: switch.marao_dashboard_test_switch
            name: Switch + graph
            variables:
              power_entity: sensor.marao_dashboard_test_graph_history
              show_graph: true
          - type: history-graph
            entities:
              - sensor.marao_dashboard_test_graph_history
            hours_to_show: 1
            show_names: false

      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_month_energy
        name: Month Power
        period: month
        popup_hash: "#marao-dashboard-test-energy-month-popup"

      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_today_energy
        name: Today Power
        period: day
        popup_hash: "#marao-dashboard-test-energy-today-popup"

      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_month_cost
        name: Month Cost
        period: month
        popup_hash: "#marao-dashboard-test-energy-month-cost-popup"

      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_today_cost
        name: Today Cost
        period: day
        popup_hash: "#marao-dashboard-test-energy-today-cost-popup"

      - type: custom:marao-card
        template: hc_fan_card
        entity: fan.marao_dashboard_test_fan
        name: Fan + slider
        variables:
          enable_slider: true

      - type: custom:marao-card
        template: hc_fan_card
        entity: fan.marao_dashboard_test_fan
        name: Fan without slider
        variables:
          enable_slider: false

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_climate
        name: Climate
        variables:
          mode_selector_hash: "#climate-mode-test"

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_single_mode_climate
        name: Single Mode Climate
        variables:
          mode_selector_hash: "#single-mode-climate-should-not-open"

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_multi_mode_climate
        name: Multi Mode Climate
        variables:
          mode_selector_hash: "#multi-mode-climate-test"

      - type: custom:marao-card
        template: hc_climate_card
        entity: sensor.marao_dashboard_test_climate_heat
        name: Climate · Heat
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: sensor.marao_dashboard_test_climate_cool
        name: Climate · Cool
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: sensor.marao_dashboard_test_climate_heat_cool
        name: Climate · Heat/Cool
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: sensor.marao_dashboard_test_climate_auto
        name: Climate · Auto
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: sensor.marao_dashboard_test_climate_dry
        name: Climate · Dry
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: sensor.marao_dashboard_test_climate_fan
        name: Climate · Fan
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: sensor.marao_dashboard_test_climate_off
        name: Climate · Off
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_media_card
        entity: input_select.marao_dashboard_test_media
        name: Apple TV
        variables:
          apple_tv: true
          popup_hash: "#marao-dashboard-test-apple-tv-popup"

      - type: custom:marao-card
        template: hc_security_card
        entity: alarm_control_panel.marao_dashboard_test_alarm
        variables:
          hc_security_code: "1234"

      - type: custom:marao-card
        template: hc_access_hold_action_card
        entity: alarm_control_panel.marao_dashboard_test_alarm
        name: Arm away · hold
        icon: mdi:shield-lock
        variables:
          action_service: alarm_control_panel.alarm_arm_away
          action_label_key: security.arm_away
          action_color: var(--color-red)

      - type: custom:marao-card
        template: hc_sensor_card
        entity: sensor.marao_dashboard_test_temperature
        name: Sensor

      - type: custom:marao-card
        template: hc_battery_card
        entity: sensor.marao_dashboard_test_battery
        name: Battery

      - type: vertical-stack
        cards:
          - type: custom:marao-card
            template: hc_graph_card
            entity: sensor.marao_dashboard_test_graph_history
            name: Graph
          - type: history-graph
            entities:
              - sensor.marao_dashboard_test_graph_history
            hours_to_show: 1
            show_names: false

      - type: custom:marao-card
        template: hc_timeline_card
        entity: lock.marao_dashboard_test_lock
        variables:
          timeline_name: Lock state - last 24 hours

      - type: vertical-stack
        cards:
          - type: custom:marao-card
            template: hc_toggle_graph_card
            entity: sensor.marao_dashboard_test_graph_history
            name: Toggle graph
            variables:
              toggle_entity: switch.marao_dashboard_test_switch
          - type: history-graph
            entities:
              - sensor.marao_dashboard_test_graph_history
            hours_to_show: 1
            show_names: false

      - type: custom:marao-card
        template: hc_scene_card
        entity: input_select.marao_dashboard_test_scene
        variables:
          icon_1: mdi:sofa
          name_1: Relax
          icon_2: mdi:movie
          name_2: Movie
          icon_3: mdi:silverware-fork-knife
          name_3: Dinner
          icon_4: mdi:weather-night
          name_4: Night
          icon_5: mdi:power
          name_5: Off

      - type: custom:marao-card
        template: hc_number_card
        entity: input_number.marao_dashboard_test_number
        name: Number

      - type: custom:marao-card
        template: hc_wallbox_current_card
        entity: input_number.marao_dashboard_test_wallbox_current
        name: Wallbox charging current
        variables:
          shortcuts: [6, 12, 16]

      - type: custom:marao-card
        template: hc_wallbox_current_card
        entity: input_number.marao_dashboard_test_wallbox_current
        name: Wallbox current without shortcuts

      - type: custom:marao-card
        template: hc_vacuum_card
        entity: vacuum.marao_dashboard_test_vacuum
        name: Vacuum

      - type: custom:marao-card
        template: hc_dishwasher_card
        entity: input_select.marao_dashboard_test_dishwasher_state
        variables:
          progress_entity: sensor.marao_dashboard_test_dishwasher_progress
          salt_entity: input_boolean.marao_dashboard_test_dishwasher_salt
          rinse_aid_entity: input_boolean.marao_dashboard_test_dishwasher_rinse_aid
          remaining_time_entity: sensor.marao_dashboard_test_dishwasher_remaining
          active_program_entity: input_select.marao_dashboard_test_dishwasher_program

      - type: custom:marao-card
        template: hc_washing_machine_card
        entity: binary_sensor.marao_dashboard_test_washing_machine

      - type: custom:marao-card
        template: hc_navigation_card
        entity: switch.marao_dashboard_test_switch
        name: Bubble popup
        icon: mdi:card-account-details-outline
        tap_action:
          action: navigate
          navigation_path: "#marao-dashboard-card-test-popup"

      - type: custom:marao-card
        template: hc_room_card
        entity: light.marao_dashboard_test_light
        name: Room card
        icon: mdi:sofa
        variables:
          light_entities:
            - light.marao_dashboard_test_light
          lights_target_entity: light.marao_dashboard_test_light
          room_navigation_path: /marao-dashboard/rooms

      - type: custom:marao-card
        template: hc_blinds_popup_card
        entity: cover.marao_dashboard_test_cover
        name: Blinds popup
        icon: mdi:blinds
        variables:
          popup_hash: "#marao-dashboard-test-blinds-popup"
          entities:
            - cover.marao_dashboard_test_cover

      - type: custom:marao-card
        template: hc_lights_popup_card
        entity: light.marao_dashboard_test_light
        name: Lights popup
        icon: mdi:lightbulb-group
        variables:
          popup_hash: "#marao-dashboard-test-lights-popup"
          entities:
            - light.marao_dashboard_test_light

      - type: custom:marao-card
        template: hc_climate_popup_card
        entity: climate.marao_dashboard_test_climate
        name: Climate popup
        icon: mdi:thermostat
        variables:
          popup_hash: "#marao-dashboard-test-climate-popup"
          entities:
            - climate.marao_dashboard_test_climate
            - climate.marao_dashboard_test_single_mode_climate

      - type: custom:marao-card
        template: hc_maintenance_popup_card
        entity: sensor.marao_dashboard_test_battery
        name: Maintenance popup
        icon: mdi:wrench
        variables:
          popup_hash: "#marao-dashboard-test-maintenance-popup"
          entities:
            - sensor.marao_dashboard_test_battery

  - type: custom:marao-popup-card
    hash: "#climate-mode-test"
    entity: climate.marao_dashboard_test_climate
    name: Climate Mode
    icon: mdi:thermostat
    height: auto
    max_height: 80dvh
    cards:
      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_climate
        name: Climate
        variables:
          show_mode_buttons: true

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-camera-popup"
    entity: camera.marao_dashboard_test_camera
    name: Camera events
    icon: mdi:cctv
    height: auto
    max_height: 80dvh
    cards:
      - type: custom:marao-camera-events-card
        entity: camera.marao_dashboard_test_camera
        title: Camera events
        event_provider: marao_test

  - type: custom:marao-popup-card
    hash: "#multi-mode-climate-test"
    entity: climate.marao_dashboard_test_multi_mode_climate
    name: Multi Mode Climate
    icon: mdi:thermostat
    height: auto
    max_height: 80dvh
    cards:
      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_multi_mode_climate
        name: Multi Mode Climate
        variables:
          show_mode_buttons: true

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-card-test-popup"
    entity: switch.marao_dashboard_test_switch
    name: Marao Popup
    icon: mdi:card-account-details-outline
    height: auto
    max_height: 80dvh
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_sensor_card
            entity: sensor.marao_dashboard_test_temperature
            name: Popup sensor

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-blinds-popup"
    name: Blinds
    icon: mdi:blinds
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_cover_card
            entity: cover.marao_dashboard_test_cover
            name: Marao Dashboard Test Cover

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-lights-popup"
    name: Lights
    icon: mdi:lightbulb
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_light_card
            entity: light.marao_dashboard_test_light
            name: Marao Dashboard Test Light

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-lock-popup"
    entity: lock.marao_dashboard_test_lock
    name: Lock
    icon: mdi:lock
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_access_slide_action_card
            entity: lock.marao_dashboard_test_lock
            name: Unlock
            icon: mdi:lock-open-variant
            variables:
              action_service: lock.unlock
              action_requires_hold: false
              action_label_key: common.unlock
              action_color: var(--color-red)
          - type: custom:marao-card
            template: hc_access_action_card
            entity: lock.marao_dashboard_test_lock
            name: Lock
            icon: mdi:lock
            variables:
              action_service: lock.lock
              action_requires_hold: false
              action_label_key: common.lock
              action_color: var(--color-green)

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-garage-door-popup"
    entity: cover.marao_dashboard_test_garage_door
    name: Garage Door
    icon: mdi:garage
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_access_slide_action_card
            entity: cover.marao_dashboard_test_garage_door
            name: Open
            icon: mdi:garage-open
            variables:
              action_service: cover.open_cover
              action_requires_hold: false
              action_label_key: common.open
              action_color: var(--color-red)
          - type: custom:marao-card
            template: hc_access_action_card
            entity: cover.marao_dashboard_test_garage_door
            name: Close
            icon: mdi:garage
            variables:
              action_service: cover.close_cover
              action_requires_hold: false
              action_label_key: common.close
              action_color: var(--color-green)

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-climate-popup"
    name: Climate
    icon: mdi:thermostat
    cards:
      - type: vertical-stack
        cards:
          - type: custom:marao-card
            template: hc_climate_card
            entity: climate.marao_dashboard_test_climate
            name: Marao Dashboard Test Climate
            variables:
              show_mode_buttons: true
          - type: custom:marao-card
            template: hc_climate_card
            entity: climate.marao_dashboard_test_single_mode_climate
            name: Marao Dashboard Test Single Mode Climate
            variables:
              show_mode_buttons: true

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-maintenance-popup"
    name: Maintenance
    icon: mdi:wrench
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_battery_card
            entity: sensor.marao_dashboard_test_battery
            name: Marao Dashboard Test Battery

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-energy-month-popup"
    name: Month Power
    icon: mdi:flash
    height: auto
    max_height: 80dvh
    cards:
      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_month_energy
        name: Month Power
        period: month
        popup: true

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-energy-today-popup"
    name: Today Power
    icon: mdi:flash-outline
    height: auto
    max_height: 80dvh
    cards:
      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_today_energy
        name: Today Power
        period: day
        popup: true

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-energy-month-cost-popup"
    name: Month Cost
    icon: mdi:currency-eur
    height: auto
    max_height: 80dvh
    cards:
      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_month_cost
        name: Month Cost
        period: month
        popup: true

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-energy-today-cost-popup"
    name: Today Cost
    icon: mdi:cash-clock
    height: auto
    max_height: 80dvh
    cards:
      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_today_cost
        name: Today Cost
        period: day
        popup: true

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-apple-tv-popup"
    entity: input_select.marao_dashboard_test_media
    name: Apple TV
    icon: mdi:remote-tv
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:marao-card
            template: hc_media_app_card
            entity: input_select.marao_dashboard_test_media
            name: YouTube
            icon: mdi:youtube
            show_state: false
            variables:
              app_source: YouTube
          - type: custom:marao-card
            template: hc_media_app_card
            entity: input_select.marao_dashboard_test_media
            name: Plex
            icon: mdi:plex
            show_state: false
            variables:
              app_source: Plex
      - type: grid
        columns: 3
        square: false
        cards:
          -
            type: custom:marao-card
            entity: input_select.marao_dashboard_test_media
            show_name: false
            show_state: false
            show_label: false
            icon: mdi:arrow-u-left-top
            tap_action:
              action: perform-action
              perform_action: remote.send_command
              target:
                entity_id: remote.marao_dashboard_test_apple_tv
              data:
                command: menu
          -
            type: custom:marao-card
            entity: input_select.marao_dashboard_test_media
            show_name: false
            show_state: false
            show_label: false
            icon: mdi:chevron-up
            tap_action:
              action: perform-action
              perform_action: remote.send_command
              target:
                entity_id: remote.marao_dashboard_test_apple_tv
              data:
                command: up
          - type: custom:marao-card
            entity: input_select.marao_dashboard_test_media
            show_name: false
            show_state: false
            show_label: false
            icon: mdi:home-outline
            tap_action:
              action: perform-action
              perform_action: remote.send_command
              target:
                entity_id: remote.marao_dashboard_test_apple_tv
              data:
                command: top_menu
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:marao-card
            entity: input_select.marao_dashboard_test_media
            show_name: false
            show_state: false
            show_label: false
            icon: mdi:chevron-left
            tap_action:
              action: perform-action
              perform_action: remote.send_command
              target:
                entity_id: remote.marao_dashboard_test_apple_tv
              data:
                command: left
          - type: custom:marao-card
            entity: input_select.marao_dashboard_test_media
            show_name: false
            show_state: false
            show_label: false
            icon: mdi:checkbox-blank-circle
            styles:
              grid:
                - grid-template-areas: '"i"'
              card:
                - height: 88px
                - padding: 0
                - border-radius: 30px
                - background: var(--primary-color)
                - box-shadow: var(--ha-card-box-shadow)
              icon:
                - width: 24px
                - color: var(--active-text-color)
              img_cell:
                - width: 100%
                - height: 100%
                - background: none
                - justify-self: center
                - align-self: center
            tap_action:
              action: perform-action
              perform_action: remote.send_command
              target:
                entity_id: remote.marao_dashboard_test_apple_tv
              data:
                command: select
          - type: custom:marao-card
            entity: input_select.marao_dashboard_test_media
            show_name: false
            show_state: false
            show_label: false
            icon: mdi:chevron-right
            tap_action:
              action: perform-action
              perform_action: remote.send_command
              target:
                entity_id: remote.marao_dashboard_test_apple_tv
              data:
                command: right
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:marao-card
            entity: input_select.marao_dashboard_test_media
            show_name: false
            show_state: false
            show_label: false
            icon: mdi:rewind-10
            tap_action:
              action: perform-action
              perform_action: media_player.media_seek
              target:
                entity_id: input_select.marao_dashboard_test_media
              data:
                seek_position: 0
          - type: custom:marao-card
            entity: input_select.marao_dashboard_test_media
            show_name: false
            show_state: false
            show_label: false
            icon: mdi:chevron-down
            tap_action:
              action: perform-action
              perform_action: remote.send_command
