schema: spec-driven
context: |
  Marao is a complete mobile HA dashboard: Python integration/generator, vanilla
  JavaScript custom elements, visual/JSON editor, theme and safe Cases gallery.
  AGENTS.md controls this workflow. Use openspec/README.md to route to affected
  capability specs and relevant project-context, quality and source/check sections;
  do not reread all documentation or copy its policies into every artifact.
  Small repairs restoring documented behavior use the short path; new behavior,
  contracts, migrations and substantial cross-layer work use OpenSpec changes.
  Agents may operate only disposable 192.168.10.229 with safe fixtures; keep secrets
  and private evidence ignored. Preserve the self-contained runtime and saved data.
  Use the applicable marao-ha-integration, marao-ha-frontend and marao-testing
  skills. Capture task scope and select test:affected visual, behavior or focused
  tiers. Current targeted inspection completes cosmetic work; full/parallel runs
  require explicit requests. Publication runs only affected unit tests across the whole candidate; reuse development integration testing. Additional integration/full release tests require an explicit user request.
rules:
  proposal:
  - State the concrete problem, scope, affected-card set (or empty), and non-goals.
  - Distinguish observed behavior, assumptions, and intended changes; name existing capability paths.
  - Assess saved-release and generated-contract compatibility; record preservation or the required versioned migration.
  specs:
  - Use testable SHALL requirements and WHEN/THEN scenarios; preserve existing requirement names in deltas.
  - Keep existing behavior in baseline specs and unfinished work in changes; never describe an unconfirmed fix as shipped.
  design:
  - Trace relevant builder, validation, generator, shared runtime, theme, translations, documentation, tests, and fixtures.
  - Reuse existing components and state any migration, data-preservation, privacy, and action-safety implications.
  - For persistence, ownership or upgrade changes, describe historical inputs, independent expected transformations, backup/preflight/recovery and package-plus-data rollback.
  tasks:
  - Make tasks concrete and checkable; keep future or unverified work unchecked.
  - Batch related tasks; choose visual inspection for presentation-only work, smallest behavioral assertions for behavior changes, and focused coverage for sensitive contracts. Inspect current affected UI once and stop when acceptance, required checks, diagnostics and cleanup are satisfied.
  - Include gallery and realistic-page examples when supported behavior changes; retain affected alignment checks only in explicitly selected integration coverage.
  - Require unit-only verify:publish before a push, tag or release; run additional integration/full tests only if explicitly requested.
  - Keep focused migration/recovery checks in development; reuse them at release without new preserved-install reports unless explicitly requested.
  - Verify requested outcomes against implementation and evidence; artifact existence and passing tests alone are not completion.
operations:
  apply:
    guidance:
    - Follow AGENTS.md; record acceptance cases and affected shared consumers, capture the task baseline before editing, and preserve unrelated dirty/concurrent work.
    - Assess upgrade impact when formats, generated contracts or persistence change; preserve supported saved configurations and expected fixtures.
    - "Implement related queued tasks together and complete the selected development tier. Retain early checks for dependent migrations/security. Keep disposable 192.168.10.229 current before completion: preview syncs frontend files to compatible HA and refreshes the browser; fresh/backend/fixture setup uses explicit ha:sync. Leave successful assets installed unless the project is reverted. Preserve safe helper cleanup and failed-operation recovery; watch runs only while open."
    - Compare implementation and evidence with requested outcomes. One current targeted UI inspection is sufficient; do not broaden or repeat without changed inputs, a failure or a concrete concern. Tooling-only work needs no HA visit; development scope cannot narrow publication.
  archive:
    guidance:
    - Archive only completed and verified work; never archive unresolved upstream follow-ups as complete.
    - Keep baseline specs synchronized with the accepted change and report remaining limitations honestly.
