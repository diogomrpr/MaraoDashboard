history: {}

script:
  marao_dashboard_test_opener:
    alias: Safe script access opener
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.marao_dashboard_test_opener_count
        data:
          value: "{{ states('input_number.marao_dashboard_test_opener_count') | int + 1 }}"

unifiprotect:

scene:
  - name: Marao Dashboard Test Native Scene
    entities:
      input_boolean.marao_dashboard_test_one: "on"

input_boolean:
  marao_dashboard_test_action_failure:
    name: Simulate safe action failure
    initial: true
  marao_dashboard_test_media_failure:
    name: Simulate media failure
    initial: true
  marao_dashboard_test_appliance_warning:
    name: Simulate appliance warning
    initial: true
  marao_dashboard_test_one:
    name: Marao Dashboard Test One
  marao_dashboard_test_two:
    name: Marao Dashboard Test Two
  marao_dashboard_test_three:
    name: Marao Dashboard Test Three
  marao_dashboard_test_light:
    name: Marao Dashboard Test Light
  marao_dashboard_test_room_light:
    name: Marao Dashboard Test Room Light
  marao_dashboard_test_switch:
    name: Marao Dashboard Test Switch
  marao_dashboard_test_climate_heater:
    name: Marao Dashboard Test Climate Heater
  marao_dashboard_test_single_mode_climate_heater:
    name: Marao Dashboard Test Single Mode Climate Heater
  marao_dashboard_test_dishwasher_salt:
    name: Marao Dashboard Test Dishwasher Salt
  marao_dashboard_test_dishwasher_rinse_aid:
    name: Marao Dashboard Test Dishwasher Rinse Aid
  marao_dashboard_test_washing_machine:
    name: Marao Dashboard Test Washing Machine
  marao_dashboard_test_lock:
    name: Marao Dashboard Test Lock
  marao_dashboard_test_open_only_door:
    name: Marao Dashboard Test Open-only Door
  marao_dashboard_test_wallbox_pause:
    name: Marao Dashboard Test Wallbox Pause

input_number:
  marao_dashboard_test_opener_count:
    name: Safe opener dispatch count
    min: 0
    max: 1000
    step: 1
    initial: 0
  marao_dashboard_test_light_brightness:
    name: Marao Dashboard Test Light Brightness
    min: 1
    max: 255
    step: 1
    mode: slider
  marao_dashboard_test_cover_position:
    name: Marao Dashboard Test Cover Position
    min: 0
    max: 100
    step: 1
    mode: slider
  marao_dashboard_test_garage_door_position:
    name: Marao Dashboard Test Garage Door Position
    min: 0
    max: 100
    step: 1
    mode: slider
  marao_dashboard_test_fan_percentage:
    name: Marao Dashboard Test Fan Percentage
    min: 0
    max: 100
    step: 1
    mode: slider
  marao_dashboard_test_temperature:
    name: Marao Dashboard Test Temperature
    min: -20
    max: 50
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
  marao_dashboard_test_humidity:
    name: Marao Dashboard Test Humidity
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
  marao_dashboard_test_power:
    name: Marao Dashboard Test Power
    min: 0
    max: 5000
    step: 1
    mode: slider
    unit_of_measurement: W
  marao_dashboard_test_battery:
    name: Marao Dashboard Test Battery
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
  marao_dashboard_test_number:
    name: Marao Dashboard Test Number
    min: 0
    max: 100
    step: 1
    mode: slider
  marao_dashboard_test_wallbox_current:
    name: Marao Dashboard Test Wallbox Current
    min: 6
    max: 32
    step: 1
    mode: slider
    unit_of_measurement: A
  marao_dashboard_test_month_energy:
    name: Marao Dashboard Test Month Energy
    min: 0
    max: 1000
    step: 1
    mode: slider
    unit_of_measurement: kWh
  marao_dashboard_test_today_energy:
    name: Marao Dashboard Test Today Energy
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: kWh
  marao_dashboard_test_month_cost:
    name: Marao Dashboard Test Month Cost
    min: 0
    max: 500
    step: 0.01
    mode: slider
    unit_of_measurement: EUR
  marao_dashboard_test_today_cost:
    name: Marao Dashboard Test Today Cost
    min: 0
    max: 100
    step: 0.01
    mode: slider
    unit_of_measurement: EUR
  marao_dashboard_test_dishwasher_progress:
    name: Marao Dashboard Test Dishwasher Progress
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
  marao_dashboard_test_dishwasher_remaining:
    name: Marao Dashboard Test Dishwasher Remaining
    min: 0
    max: 180
    step: 1
    mode: slider
    unit_of_measurement: min

input_select:
  marao_dashboard_test_weather_condition:
    name: Marao Dashboard Test Weather Condition
    options:
      - sunny
      - cloudy
      - rainy
      - windy
  marao_dashboard_test_scene:
    name: Marao Dashboard Test Scene
    options:
      - Relax
      - Movie
      - Dinner
      - Night
      - Off
  marao_dashboard_test_alarm:
    name: Marao Dashboard Test Alarm
    options:
      - disarmed
      - armed_home
      - armed_away
      - armed_night
      - armed_vacation
      - armed_custom_bypass
      - arming
      - triggered
  marao_dashboard_test_vacuum:
    name: Marao Dashboard Test Vacuum
    options:
      - docked
      - cleaning
      - paused
      - returning
      - error
  marao_dashboard_test_dishwasher_state:
    name: Marao Dashboard Test Dishwasher State
    options:
      - idle
      - run
      - pause
      - finish
      - error
  marao_dashboard_test_dishwasher_program:
    name: Marao Dashboard Test Dishwasher Program
    options:
      - Auto
      - Eco
      - Intensive
      - Quick

vacuum:
  - platform: marao_test_vacuum

cover:
  - platform: marao_test_cover
    name: Marao Dashboard Test Open Only Door

climate:
  - platform: marao_test_climate
    name: Marao Dashboard Test Dual Target Climate
    initial_state: heat_cool
    dual_target: true
  - platform: marao_test_climate
    name: Marao Dashboard Test Multi Mode Climate
  - platform: generic_thermostat
    name: Marao Dashboard Test Climate
    unique_id: marao_dashboard_test_climate
    heater: switch.marao_dashboard_test_climate_heater
    target_sensor: sensor.marao_dashboard_test_temperature
    min_temp: 16
    max_temp: 30
    target_temp: 21
    cold_tolerance: 0.5
    hot_tolerance: 0.5
    precision: 0.5
  - platform: generic_thermostat
    name: Marao Dashboard Test Single Mode Climate
    unique_id: marao_dashboard_test_single_mode_climate
    heater: switch.marao_dashboard_test_single_mode_climate_heater
    target_sensor: sensor.marao_dashboard_test_temperature
    min_temp: 16
    max_temp: 30
    target_temp: 21
    cold_tolerance: 0.5
    hot_tolerance: 0.5
    precision: 0.5

camera:
  - platform: marao_test_camera
    name: Marao Dashboard Test Media Error
    picture_error: true
  - platform: marao_test_camera
    name: Marao Dashboard Test Camera
    live: true

  - platform: unifiprotect
    name: Marao Dashboard Test Camera Slow High
    live: true
    quality: high
  - platform: unifiprotect
    name: Marao Dashboard Test Camera Slow Low
    live: true
    quality: low

media_player:
  - platform: marao_test_media
    name: Marao Dashboard Test Media Error
    initial_state: playing
    picture_error: true
  - platform: marao_test_media
    name: Marao Dashboard Test Apple TV
  - platform: marao_test_media
    name: Marao Dashboard Test Audio

remote:
  - platform: marao_test_media
    name: Marao Dashboard Test Apple TV
  - platform: marao_test_media
    name: Marao Dashboard Test Remote Unknown
    initial_state: unknown
  - platform: marao_test_media
    name: Marao Dashboard Test Remote Unavailable
    initial_state: unavailable

homeassistant:
  customize:
    climate.marao_dashboard_test_single_mode_climate:
      hvac_modes:
        - "heat"

template:
  - sensor:
      - name: Marao Dashboard Test Refill Confirmation
        default_entity_id: sensor.marao_dashboard_test_refill_confirmation
        unique_id: marao_dashboard_test_refill_confirmation
        state: "confirmed"
  - button:
      - name: Marao Dashboard Test Opener
        default_entity_id: button.marao_dashboard_test_opener
        unique_id: marao_dashboard_test_opener
        press:
          - action: input_number.set_value
            target:
              entity_id: input_number.marao_dashboard_test_opener_count
            data:
              value: "{{ states('input_number.marao_dashboard_test_opener_count') | int + 1 }}"
  - weather:
      - name: Marao Dashboard Test Weather
        default_entity_id: weather.marao_dashboard_test_weather
        unique_id: marao_dashboard_test_weather
        condition: "{{ states('input_select.marao_dashboard_test_weather_condition') }}"
        temperature: "21"
        temperature_unit: "°C"
        humidity: "50"
        attributes:
          forecast: >-
            {{ [dict(datetime=(now() + timedelta(days=1)).isoformat(), condition='cloudy', temperature=22, templow=14),
                dict(datetime=(now() + timedelta(days=2)).isoformat(), condition='rainy', temperature=19, templow=12)] }}
  - light:
      - name: Marao Dashboard Test Light
        default_entity_id: light.marao_dashboard_test_light
        unique_id: marao_dashboard_test_light
        state: "{{ is_state('input_boolean.marao_dashboard_test_light', 'on') }}"
        level: "{{ states('input_number.marao_dashboard_test_light_brightness') | int }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.marao_dashboard_test_light
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.marao_dashboard_test_light
        set_level:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.marao_dashboard_test_light
          - action: input_number.set_value
            target:
              entity_id: input_number.marao_dashboard_test_light_brightness
            data:
              value: "{{ brightness }}"
      - name: Marao Dashboard Test Room Light
        default_entity_id: light.marao_dashboard_test_room_light
        unique_id: marao_dashboard_test_room_light
        state: "{{ is_state('input_boolean.marao_dashboard_test_room_light', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.marao_dashboard_test_room_light
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.marao_dashboard_test_room_light
  - switch:
      - name: Marao Dashboard Test Switch
        default_entity_id: switch.marao_dashboard_test_switch
        unique_id: marao_dashboard_test_switch
        state: "{{ is_state('input_boolean.marao_dashboard_test_switch', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.marao_dashboard_test_switch
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.marao_dashboard_test_switch
      - name: Marao Dashboard Test Climate Heater
        default_entity_id: switch.marao_dashboard_test_climate_heater
        unique_id: marao_dashboard_test_climate_heater
        state: "{{ is_state('input_boolean.marao_dashboard_test_climate_heater', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.marao_dashboard_test_climate_heater
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.marao_dashboard_test_climate_heater
      - name: Marao Dashboard Test Single Mode Climate Heater
        default_entity_id: switch.marao_dashboard_test_single_mode_climate_heater
        unique_id: marao_dashboard_test_single_mode_climate_heater
        state: "{{ is_state('input_boolean.marao_dashboard_test_single_mode_climate_heater', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.marao_dashboard_test_single_mode_climate_heater
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.marao_dashboard_test_single_mode_climate_heater
  - cover:
      - name: Marao Dashboard Test Cover
        default_entity_id: cover.marao_dashboard_test_cover
        unique_id: marao_dashboard_test_cover
        optimistic: true
        state: "{{ 'open' if states('input_number.marao_dashboard_test_cover_position') | int > 0 else 'closed' }}"
        position: "{{ states('input_number.marao_dashboard_test_cover_position') | int }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.marao_dashboard_test_cover_position
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.marao_dashboard_test_cover_position
            data:
              value: 0
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.marao_dashboard_test_cover_position
            data:
              value: "{{ position }}"
      - name: Marao Dashboard Test Garage Door
        default_entity_id: cover.marao_dashboard_test_garage_door
        unique_id: marao_dashboard_test_garage_door
        device_class: garage
        optimistic: true
        state: "{{ 'open' if states('input_number.marao_dashboard_test_garage_door_position') | int > 0 else 'closed' }}"
        position: "{{ states('input_number.marao_dashboard_test_garage_door_position') | int }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.marao_dashboard_test_garage_door_position
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.marao_dashboard_test_garage_door_position
            data:
              value: 0
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.marao_dashboard_test_garage_door_position
            data:
              value: "{{ position }}"
  - lock:
      - name: Marao Dashboard Test Lock
        default_entity_id: lock.marao_dashboard_test_lock
        unique_id: marao_dashboard_test_lock
        state: "{{ is_state('input_boolean.marao_dashboard_test_lock', 'on') }}"
        lock:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.marao_dashboard_test_lock
        unlock:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.marao_dashboard_test_lock
  - fan:
      - name: Marao Dashboard Test Fan
        default_entity_id: fan.marao_dashboard_test_fan
        unique_id: marao_dashboard_test_fan
        state: "{{ states('input_number.marao_dashboard_test_fan_percentage') | int > 0 }}"
        percentage: "{{ states('input_number.marao_dashboard_test_fan_percentage') | int }}"
        turn_on:
          - action: input_number.set_value
            target:
              entity_id: input_number.marao_dashboard_test_fan_percentage
            data:
              value: 50
        turn_off:
          - action: input_number.set_value
            target:
              entity_id: input_number.marao_dashboard_test_fan_percentage
            data:
              value: 0
        set_percentage:
          - action: input_number.set_value
            target:
              entity_id: input_number.marao_dashboard_test_fan_percentage
            data:
              value: "{{ percentage }}"
  - alarm_control_panel:
      - name: Marao Dashboard Test Alarm
        default_entity_id: alarm_control_panel.marao_dashboard_test_alarm
        unique_id: marao_dashboard_test_alarm
        state: "{{ states('input_select.marao_dashboard_test_alarm') }}"
        arm_home:
          - action: input_select.select_option
            target:
              entity_id: input_select.marao_dashboard_test_alarm
            data:
              option: armed_home
        arm_night:
          - action: input_select.select_option
            target:
              entity_id: input_select.marao_dashboard_test_alarm
            data:
              option: armed_night
        arm_vacation:
          - action: input_select.select_option
            target:
              entity_id: input_select.marao_dashboard_test_alarm
            data:
              option: armed_vacation
        arm_custom_bypass:
          - action: input_select.select_option
            target:
              entity_id: input_select.marao_dashboard_test_alarm
            data:
              option: armed_custom_bypass
        arm_away:
          - action: input_select.select_option
            target:
              entity_id: input_select.marao_dashboard_test_alarm
            data:
              option: armed_away
        disarm:
          - action: input_select.select_option
            target:
              entity_id: input_select.marao_dashboard_test_alarm
            data:
              option: disarmed
        trigger:
          - action: input_select.select_option
            target:
              entity_id: input_select.marao_dashboard_test_alarm
            data:
              option: triggered
  - vacuum:
      - name: Marao Dashboard Test Vacuum
        default_entity_id: vacuum.marao_dashboard_test_vacuum
        unique_id: marao_dashboard_test_vacuum
        state: "{{ states('input_select.marao_dashboard_test_vacuum') }}"
        start:
          - action: input_select.select_option
            target:
              entity_id: input_select.marao_dashboard_test_vacuum
            data:
              option: cleaning
        pause:
          - action: input_select.select_option
            target:
              entity_id: input_select.marao_dashboard_test_vacuum
            data:
              option: paused
        stop:
          - action: input_select.select_option
            target:
              entity_id: input_select.marao_dashboard_test_vacuum
            data:
              option: docked
        return_to_base:
          - action: input_select.select_option
            target:
              entity_id: input_select.marao_dashboard_test_vacuum
            data:
              option: returning
  - sensor:
      - name: Marao Dashboard Test History Empty
        unique_id: marao_dashboard_test_history_empty
        state: "21"
      - name: Marao Dashboard Test History Loading
        unique_id: marao_dashboard_test_history_loading
        state: "21"
      - name: Marao Dashboard Test History Error
        unique_id: marao_dashboard_test_history_error
        state: "21"
      - name: Marao Dashboard Test Person
        unique_id: marao_dashboard_test_person
        state: home
      - name: Marao Dashboard Test Temperature
        unique_id: marao_dashboard_test_temperature_sensor
        state: "{{ states('input_number.marao_dashboard_test_temperature') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Marao Dashboard Test Humidity
        unique_id: marao_dashboard_test_humidity_sensor
        state: "{{ states('input_number.marao_dashboard_test_humidity') }}"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
      - name: Marao Dashboard Test Power
        unique_id: marao_dashboard_test_power_sensor
        state: "{{ states('input_number.marao_dashboard_test_power') }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Marao Dashboard Test Energy Format Mixed
        unique_id: marao_dashboard_test_energy_format_mixed
        state: "1234.5"
        unit_of_measurement: Wh
      - name: Marao Dashboard Test Energy Format Power
        unique_id: marao_dashboard_test_energy_format_power
        state: "1500"
        unit_of_measurement: W
      - name: Marao Dashboard Test Energy Format Export
        unique_id: marao_dashboard_test_energy_format_export
        state: "-1234.5"
        unit_of_measurement: Wh
      - name: Marao Dashboard Test Energy Format Zero
        unique_id: marao_dashboard_test_energy_format_zero
        state: "0"
        unit_of_measurement: W
      - name: Marao Dashboard Test Energy Format Cost
        unique_id: marao_dashboard_test_energy_format_cost
        state: "1.2345"
        unit_of_measurement: EUR
      - name: Marao Dashboard Test Energy Format Missing Live
        unique_id: marao_dashboard_test_energy_format_missing_live
        state: "42"
        unit_of_measurement: Wh
      - name: Marao Dashboard Test Energy Format Missing History
        unique_id: marao_dashboard_test_energy_format_missing_history
        state: "2345"
        unit_of_measurement: Wh
      - name: Marao Dashboard Test Energy Format Incompatible History
        unique_id: marao_dashboard_test_energy_format_incompatible_history
        state: "3456"
        unit_of_measurement: Wh
      - name: Marao Dashboard Test Energy Format Unavailable
        unique_id: marao_dashboard_test_energy_format_unavailable
        state: "0"
        availability: "{{ false }}"
        unit_of_measurement: Wh
      - name: Marao Dashboard Test Month Energy
        unique_id: marao_dashboard_test_month_energy_sensor
        state: "{{ states('input_number.marao_dashboard_test_month_energy') }}"
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Marao Dashboard Test Today Energy
        unique_id: marao_dashboard_test_today_energy_sensor
        state: "{{ states('input_number.marao_dashboard_test_today_energy') }}"
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Marao Dashboard Test Month Cost
        unique_id: marao_dashboard_test_month_cost_sensor
        state: "{{ states('input_number.marao_dashboard_test_month_cost') }}"
        unit_of_measurement: EUR
        state_class: measurement
      - name: Marao Dashboard Test Today Cost
        unique_id: marao_dashboard_test_today_cost_sensor
        state: "{{ states('input_number.marao_dashboard_test_today_cost') }}"
        unit_of_measurement: EUR
        state_class: measurement
      - name: Marao Dashboard Test Wallbox Status
        unique_id: marao_dashboard_test_wallbox_status_sensor
        state: "{{ 'paused' if is_state('input_boolean.marao_dashboard_test_wallbox_pause', 'on') else 'charging' }}"
      - name: Marao Dashboard Test Wallbox Power
        unique_id: marao_dashboard_test_wallbox_power_sensor
        state: "{{ states('input_number.marao_dashboard_test_power') }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Marao Dashboard Test Wallbox Maximum Current
        unique_id: marao_dashboard_test_wallbox_max_current_sensor
        state: "32"
        unit_of_measurement: A
        device_class: current
        state_class: measurement
      - name: Marao Dashboard Test Battery
        unique_id: marao_dashboard_test_battery_sensor
        state: "{{ states('input_number.marao_dashboard_test_battery') }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: Marao Dashboard Test Battery Low
        unique_id: marao_dashboard_test_battery_low
        state: "10"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: Marao Dashboard Test Legacy Battery
        unique_id: marao_dashboard_test_legacy_battery
        state: "{{ states('input_number.marao_dashboard_test_battery') }}"
        unit_of_measurement: "%"
      - name: Marao Dashboard Test Group Invalid Battery
        default_entity_id: sensor.marao_dashboard_test_group_invalid_battery
        unique_id: marao_dashboard_test_group_invalid_battery
        state: "not a number"
      - name: Marao Dashboard Test Battery Medium
        unique_id: marao_dashboard_test_battery_medium
        state: "50"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: Marao Dashboard Test Battery Full
        unique_id: marao_dashboard_test_battery_full
        state: "95"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: Marao Dashboard Test Unknown
        unique_id: marao_dashboard_test_unknown
        state: "{{ none }}"
      - name: Marao Dashboard Test Unavailable
        unique_id: marao_dashboard_test_unavailable
        state: "0"
        availability: "{{ false }}"
      - name: Marao Dashboard Test Locking
        unique_id: marao_dashboard_test_locking
        state: "locking"
      - name: Marao Dashboard Test Unlocking
        unique_id: marao_dashboard_test_unlocking
        state: "unlocking"
      - name: Marao Dashboard Test Opening
        unique_id: marao_dashboard_test_opening
        state: "opening"
      - name: Marao Dashboard Test Closing
        unique_id: marao_dashboard_test_closing
        state: "closing"
      - name: Marao Dashboard Test Dishwasher Progress
        unique_id: marao_dashboard_test_dishwasher_progress_sensor
        state: "{{ states('input_number.marao_dashboard_test_dishwasher_progress') }}"
        unit_of_measurement: "%"
      - name: Marao Dashboard Test Dishwasher Remaining
        unique_id: marao_dashboard_test_dishwasher_remaining_sensor
        state: "{{ states('input_number.marao_dashboard_test_dishwasher_remaining') }}"
        unit_of_measurement: min
  - trigger:
      - platform: time_pattern
        seconds: "/5"
    sensor:
      - name: Marao Dashboard Test Graph History
        unique_id: marao_dashboard_test_graph_history
        state: "{{ 100 + ((as_timestamp(now()) | int) % 60) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
  - binary_sensor:
      - name: Marao Dashboard Test Washing Machine
        unique_id: marao_dashboard_test_washing_machine_binary_sensor
        state: "{{ is_state('input_boolean.marao_dashboard_test_washing_machine', 'on') }}"
        device_class: running
