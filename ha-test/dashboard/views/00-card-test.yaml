title: Cases
path: card-test
icon: mdi:test-tube
theme: Marao Dashboard
cards:
  - type: vertical-stack
    cards:
      - type: custom:marao-card
        template: hc_header_card
        entity: weather.marao_dashboard_test_weather
        variables:
          person_entity: sensor.marao_dashboard_test_person

      - type: custom:marao-card
        template: hc_title_card
        name: Marao Dashboard Cases
        label: All supported cards, states, and behaviors. Hold a navbar icon for three seconds to refresh this device. Releasing early cancels the refresh.
        variables:
          entity1: input_boolean.marao_dashboard_test_one
          entity1_name: One
          entity2: input_boolean.marao_dashboard_test_two
          entity2_name: Two
          entity3: input_boolean.marao_dashboard_test_three
          entity3_name: Three


      - type: entities
        title: State simulators
        show_header_toggle: false
        entities:
          - input_select.marao_dashboard_test_weather_condition
          - input_select.marao_dashboard_test_alarm
          - input_select.marao_dashboard_test_vacuum
          - input_select.marao_dashboard_test_dishwasher_state
          - input_select.marao_dashboard_test_dishwasher_program
          - input_boolean.marao_dashboard_test_light
          - input_boolean.marao_dashboard_test_room_light
          - input_boolean.marao_dashboard_test_switch
          - input_boolean.marao_dashboard_test_lock
          - input_boolean.marao_dashboard_test_washing_machine
          - input_boolean.marao_dashboard_test_dishwasher_salt
          - input_boolean.marao_dashboard_test_dishwasher_rinse_aid
          - input_number.marao_dashboard_test_light_brightness
          - input_number.marao_dashboard_test_cover_position
          - input_number.marao_dashboard_test_garage_door_position
          - input_number.marao_dashboard_test_fan_percentage
          - input_number.marao_dashboard_test_temperature
          - input_number.marao_dashboard_test_battery

      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_navigation_card
            name: Rooms page
            icon: mdi:sofa-outline
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /marao-dashboard/rooms
          - type: custom:marao-card
            template: hc_navigation_card
            name: Media page
            icon: mdi:television-play
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /marao-dashboard/media
          - type: custom:marao-card
            template: hc_navigation_card
            name: Appliances page
            icon: mdi:dishwasher
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /marao-dashboard/appliances

      - type: custom:marao-card
        template: hc_weather_card
        entity: weather.marao_dashboard_test_weather
        variables:
          show_forecast: false

      - type: custom:marao-card
        template: hc_weather_card
        entity: weather.marao_dashboard_test_weather
        name: Weather with forecast
        variables:
          show_forecast: true

      - type: custom:marao-card
        template: hc_camera_card
        entity: camera.marao_dashboard_test_camera
        name: Camera · automatic live video + events
        variables:
          popup_hash: "#marao-dashboard-test-camera-popup"
          event_provider: frigate
          frigate_instance_id: marao_test

      - type: custom:marao-card
        template: hc_glance_card
        variables:
          entity1: sensor.marao_dashboard_test_temperature
          entity1_name: Living Room Temperature
          entity1_icon: mdi:thermometer
          entity2: sensor.marao_dashboard_test_humidity
          entity2_name: Humidity
          entity2_icon: mdi:water-percent
          entity3: sensor.marao_dashboard_test_power
          entity3_name: Power
          entity3_icon: mdi:flash

      - type: custom:marao-card
        template: hc_glance_card
        name: Single reading
        variables:
          entity1: sensor.marao_dashboard_test_temperature
          entity1_name: Temperature

      - type: custom:marao-card
        template: hc_glance_card
        name: Mixed availability readings
        variables:
          entity1: sensor.marao_dashboard_test_power
          entity1_name: Power
          entity2: sensor.marao_dashboard_test_case_battery_unavailable
          entity2_name: Unavailable battery

      - type: custom:marao-card
        template: hc_base_card
        entity: sensor.marao_dashboard_test_temperature
        name: Base card

      - type: custom:marao-card
        template: hc_light_card
        entity: light.marao_dashboard_test_light
        name: Light + slider

      - type: custom:marao-card
        template: hc_light_card
        entity: light.marao_dashboard_test_light
        name: Light without slider
        variables:
          enable_slider: false

      - type: custom:marao-card
        template: hc_cover_card
        entity: cover.marao_dashboard_test_cover
        name: Cover + slider

      # The live action check retains this popup's idle and active access track
      # across updates from the safe light helper above.
      - type: custom:marao-card
        template: hc_access_card
        entity: lock.marao_dashboard_test_lock
        name: Lock access
        variables:
          popup_hash: "#marao-dashboard-test-lock-popup"

      - type: custom:marao-card
        template: hc_access_card
        entity: cover.marao_dashboard_test_garage_door
        name: Garage door access
        variables:
          popup_hash: "#marao-dashboard-test-garage-door-popup"

      - type: custom:marao-card
        template: hc_access_slide_action_card
        entity: cover.marao_dashboard_test_open_only_door
        name: Open-only door
        icon: mdi:door-open
        variables:
          action_service: cover.open_cover
          action_label_key: access.open
          action_color: var(--color-red)

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:marao-card
            template: hc_access_card
            entity: sensor.marao_dashboard_test_locking
            name: Locking
            tap_action: { action: none }
          - type: custom:marao-card
            template: hc_access_card
            entity: sensor.marao_dashboard_test_unlocking
            name: Unlocking
            tap_action: { action: none }
          - type: custom:marao-card
            template: hc_access_card
            entity: sensor.marao_dashboard_test_opening
            name: Opening
            tap_action: { action: none }
          - type: custom:marao-card
            template: hc_access_card
            entity: sensor.marao_dashboard_test_closing
            name: Closing
            tap_action: { action: none }

      - type: custom:marao-card
        template: hc_switch_card
        entity: switch.marao_dashboard_test_switch
        name: Switch + graph
        variables:
          power_entity: sensor.marao_dashboard_test_graph_history
          show_graph: true

      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_month_energy
        name: Month Power
        period: month
        popup_hash: "#marao-dashboard-test-energy-month-popup"

      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_today_energy
        name: Today Power
        period: day
        popup_hash: "#marao-dashboard-test-energy-today-popup"

      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_month_cost
        name: Month Cost
        period: month
        popup_hash: "#marao-dashboard-test-energy-month-cost-popup"

      - type: custom:marao-energy-period-card
        entity: sensor.marao_dashboard_test_today_cost
        name: Today Cost
        period: day
        popup_hash: "#marao-dashboard-test-energy-today-cost-popup"

      - type: custom:marao-card
        template: hc_fan_card
        entity: fan.marao_dashboard_test_fan
        name: Fan + slider
        variables:
          enable_slider: true

      - type: custom:marao-card
        template: hc_fan_card
        entity: fan.marao_dashboard_test_fan
        name: Fan without slider
        variables:
          enable_slider: false

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_climate
        name: Climate
        variables:
          mode_selector_hash: "#climate-mode-test"

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_single_mode_climate
        name: Single Mode Climate
        variables:
          mode_selector_hash: "#single-mode-climate-should-not-open"

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_multi_mode_climate
        name: Multi Mode Climate
        variables:
          mode_selector_hash: "#multi-mode-climate-test"

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_case_climate_heat
        name: Climate · Heat
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_case_climate_cool
        name: Climate · Cool
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_case_climate_heat_cool
        name: Climate · Heat/Cool
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_case_climate_auto
        name: Climate · Auto
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_case_climate_dry
        name: Climate · Dry
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_case_climate_fan_only
        name: Climate · Fan
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_case_climate_off
        name: Climate · Off
        tap_action: { action: none }

      - type: custom:marao-card
        template: hc_media_card
        entity: media_player.marao_dashboard_test_apple_tv
        name: Apple TV
        variables:
          apple_tv: true
          popup_hash: "#marao-dashboard-test-apple-tv-popup"

      - type: custom:marao-card
        template: hc_media_card
        entity: media_player.marao_dashboard_test_audio
        name: Generic media player
        variables:
          popup_hash: "#marao-dashboard-test-generic-media-popup"

      - type: custom:marao-card
        template: hc_media_card
        entity: media_player.marao_dashboard_test_case_media_playing
        name: Media without artwork
        variables:
          hc_show_background_art: false
          hc_background_color: var(--color-blue)

      - type: custom:marao-card
        template: hc_security_card
        entity: alarm_control_panel.marao_dashboard_test_alarm
        variables:
          hc_security_code: "1234"

      - type: custom:marao-card
        template: hc_access_hold_action_card
        entity: alarm_control_panel.marao_dashboard_test_alarm_no_code
        name: Arm away · hold
        icon: mdi:shield-lock
        variables:
          action_service: alarm_control_panel.alarm_arm_away
          action_label_key: security.arm_away
          action_color: var(--color-red)

      - type: custom:marao-card
        template: hc_sensor_card
        entity: sensor.marao_dashboard_test_temperature
        name: Sensor

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:marao-card
            template: hc_sensor_card
            entity: sensor.marao_dashboard_test_temperature
            name: Narrow temperature reading
          - type: custom:marao-card
            template: hc_sensor_card
            entity: sensor.marao_dashboard_test_humidity
            name: Narrow humidity reading

      - type: custom:marao-card
        template: hc_battery_card
        entity: sensor.marao_dashboard_test_battery
        name: Battery

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:marao-card
            template: hc_battery_card
            entity: sensor.marao_dashboard_test_battery_low
            name: Battery low
          - type: custom:marao-card
            template: hc_battery_card
            entity: sensor.marao_dashboard_test_battery_medium
            name: Battery medium
          - type: custom:marao-card
            template: hc_battery_card
            entity: sensor.marao_dashboard_test_battery_full
            name: Battery full

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:marao-card
            template: hc_light_card
            entity: sensor.marao_dashboard_test_unknown
            name: Unknown control
          - type: custom:marao-card
            template: hc_light_card
            entity: sensor.marao_dashboard_test_unavailable
            name: Unavailable control

      - type: custom:marao-card
        template: hc_graph_card
        entity: sensor.marao_dashboard_test_graph_history
        name: Graph

      - type: custom:marao-state-timeline-card
        entity: lock.marao_dashboard_test_lock
        name: Lock state - last 24 hours

      - type: custom:marao-card
        template: hc_toggle_graph_card
        entity: sensor.marao_dashboard_test_graph_history
        name: Toggle graph
        variables:
          toggle_entity: switch.marao_dashboard_test_switch

      - type: custom:marao-card
        template: hc_scene_card
        entity: input_select.marao_dashboard_test_scene
        variables:
          icon_1: mdi:sofa
          name_1: Relax
          icon_2: mdi:movie
          name_2: Movie
          icon_3: mdi:silverware-fork-knife
          name_3: Dinner
          icon_4: mdi:weather-night
          name_4: Night
          icon_5: mdi:power
          name_5: Off

      - type: custom:marao-card
        template: hc_number_card
        entity: input_number.marao_dashboard_test_number
        name: Number

      - type: custom:marao-card
        template: hc_wallbox_current_card
        entity: input_number.marao_dashboard_test_wallbox_current
        name: Wallbox charging current
        variables:
          shortcuts: [6, 12, 16]

      - type: custom:marao-card
        template: hc_wallbox_current_card
        entity: input_number.marao_dashboard_test_wallbox_current
        name: Wallbox current with one shortcut
        variables:
          shortcuts: [16]

      - type: custom:marao-card
        template: hc_wallbox_current_card
        entity: input_number.marao_dashboard_test_wallbox_current
        name: Wallbox current with two shortcuts
        variables:
          shortcuts: [6, 16]

      - type: custom:marao-card
        template: hc_wallbox_current_card
        entity: input_number.marao_dashboard_test_wallbox_current
        name: Wallbox current without shortcuts

      - type: custom:marao-card
        template: hc_vacuum_card
        entity: vacuum.marao_dashboard_test_vacuum
        name: Vacuum

      - type: custom:marao-card
        template: hc_dishwasher_card
        entity: input_select.marao_dashboard_test_dishwasher_state
        variables:
          progress_entity: sensor.marao_dashboard_test_dishwasher_progress
          salt_entity: input_boolean.marao_dashboard_test_dishwasher_salt
          rinse_aid_entity: input_boolean.marao_dashboard_test_dishwasher_rinse_aid
          remaining_time_entity: sensor.marao_dashboard_test_dishwasher_remaining
          active_program_entity: input_select.marao_dashboard_test_dishwasher_program

      - type: custom:marao-card
        template: hc_washing_machine_card
        entity: binary_sensor.marao_dashboard_test_washing_machine

      - type: custom:marao-card
        template: hc_navigation_card
        entity: switch.marao_dashboard_test_switch
        name: Bubble popup
        icon: mdi:card-account-details-outline
        tap_action:
          action: navigate
          navigation_path: "#marao-dashboard-card-test-popup"

      - type: custom:marao-card
        template: hc_navigation_card
        entity: switch.marao_dashboard_test_switch
        name: Fixed-height popup
        icon: mdi:arrow-up-bold-box-outline
        tap_action:
          action: navigate
          navigation_path: "#marao-dashboard-test-fixed-popup"

      - type: custom:marao-card
        template: hc_room_card
        entity: light.marao_dashboard_test_light
        name: Room card
        icon: mdi:sofa
        variables:
          light_entities:
            - light.marao_dashboard_test_light
            - light.marao_dashboard_test_room_light
          lights_target_entity: light.marao_dashboard_test_light
          room_navigation_path: /marao-dashboard/rooms
        tap_action:
          action: navigate
          navigation_path: /marao-dashboard/rooms

      - type: custom:marao-card
        template: hc_blinds_popup_card
        entity: cover.marao_dashboard_test_cover
        name: Blinds popup
        icon: mdi:blinds
        variables:
          popup_hash: "#marao-dashboard-test-blinds-popup"
          entities:
            - cover.marao_dashboard_test_cover

      - type: custom:marao-card
        template: hc_lights_popup_card
        entity: light.marao_dashboard_test_light
        name: Lights popup
        icon: mdi:lightbulb-group
        variables:
          popup_hash: "#marao-dashboard-test-lights-popup"
          entities:
            - light.marao_dashboard_test_light

      - type: custom:marao-card
        template: hc_climate_popup_card
        entity: climate.marao_dashboard_test_climate
        name: Climate popup
        icon: mdi:thermostat
        variables:
          popup_hash: "#marao-dashboard-test-climate-popup"
          entities:
            - climate.marao_dashboard_test_climate
            - climate.marao_dashboard_test_single_mode_climate

      - type: custom:marao-card
        template: hc_maintenance_popup_card
        entity: sensor.marao_dashboard_test_battery
        name: Maintenance popup
        icon: mdi:wrench
        variables:
          popup_hash: "#marao-dashboard-test-maintenance-popup"
          entities:
            - sensor.marao_dashboard_test_battery

  - type: custom:marao-popup-card
    hash: "#climate-mode-test"
    entity: climate.marao_dashboard_test_climate
    name: Climate Mode
    icon: mdi:thermostat
    height: auto
    max_height: 80dvh
    cards:
      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_climate
        name: Climate
        variables:
          show_mode_buttons: true

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-camera-popup"
    entity: camera.marao_dashboard_test_camera
    name: Camera events
    icon: mdi:cctv
    height: auto
    max_height: 80dvh
    cards:
      - type: custom:marao-camera-events-card
        entity: camera.marao_dashboard_test_camera
        title: Camera events
        event_provider: frigate
        frigate_instance_id: marao_test

  - type: custom:marao-popup-card
    hash: "#multi-mode-climate-test"
    entity: climate.marao_dashboard_test_multi_mode_climate
    name: Multi Mode Climate
    icon: mdi:thermostat
    height: auto
    max_height: 80dvh
    cards:
      - type: custom:marao-card
        template: hc_climate_card
        entity: climate.marao_dashboard_test_multi_mode_climate
        name: Multi Mode Climate
        variables:
          show_mode_buttons: true

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-card-test-popup"
    entity: switch.marao_dashboard_test_switch
    name: Marao Popup
    icon: mdi:card-account-details-outline
    height: auto
    max_height: 80dvh
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_sensor_card
            entity: sensor.marao_dashboard_test_temperature
            name: Popup sensor

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-fixed-popup"
    entity: switch.marao_dashboard_test_switch
    name: Fixed-height popup
    icon: mdi:arrow-up-bold-box-outline
    height: 420px
    max_height: 80dvh
    cards:
      - type: custom:marao-card
        template: hc_sensor_card
        entity: sensor.marao_dashboard_test_temperature
        name: Fixed popup content

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-generic-media-popup"
    entity: media_player.marao_dashboard_test_audio
    name: Generic media player
    icon: mdi:music
    height: auto
    max_height: 80dvh
    cards:
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:marao-card
            entity: media_player.marao_dashboard_test_audio
            icon: mdi:skip-previous
            show_name: false
            show_state: false
            show_label: false
            variables:
              action_label_key: media.previous
            tap_action:
              action: perform-action
              perform_action: media_player.media_previous_track
          - type: custom:marao-card
            entity: media_player.marao_dashboard_test_audio
            icon: mdi:play-pause
            show_name: false
            show_state: false
            show_label: false
            variables:
              action_label_key: media.play_pause
            tap_action:
              action: perform-action
              perform_action: media_player.media_play_pause
          - type: custom:marao-card
            entity: media_player.marao_dashboard_test_audio
            icon: mdi:skip-next
            show_name: false
            show_state: false
            show_label: false
            variables:
              action_label_key: media.next
            tap_action:
              action: perform-action
              perform_action: media_player.media_next_track

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-blinds-popup"
    name: Blinds
    icon: mdi:blinds
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_cover_card
            entity: cover.marao_dashboard_test_cover
            name: Marao Dashboard Test Cover

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-lights-popup"
    name: Lights
    icon: mdi:lightbulb
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_light_card
            entity: light.marao_dashboard_test_light
            name: Marao Dashboard Test Light
          - type: custom:marao-card
            template: hc_light_card
            entity: light.marao_dashboard_test_case_light_on
            name: Active light
          - type: custom:marao-card
            template: hc_light_card
            entity: light.marao_dashboard_test_case_light_unknown
            name: Unknown light
          - type: custom:marao-card
            template: hc_light_card
            entity: light.marao_dashboard_test_case_light_unavailable
            name: Unavailable light

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-lock-popup"
    entity: lock.marao_dashboard_test_lock
    name: Lock
    icon: mdi:lock
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_access_slide_action_card
            entity: lock.marao_dashboard_test_lock
            name: Unlock
            icon: mdi:lock-open-variant
            variables:
              action_service: lock.unlock
              action_requires_hold: false
              action_label_key: common.unlock
              action_color: var(--color-red)
          - type: custom:marao-card
            template: hc_access_action_card
            entity: lock.marao_dashboard_test_lock
            name: Lock
            icon: mdi:lock
            variables:
              action_service: lock.lock
              action_requires_hold: false
              action_label_key: common.lock
              action_color: var(--color-green)

  - type: custom:marao-popup-card
    hash: "#marao-dashboard-test-garage-door-popup"
    entity: cover.marao_dashboard_test_garage_door
    name: Garage Door
    icon: mdi:garage
    cards:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:marao-card
            template: hc_access_slide_action_card
            entity: cover.marao_dashboard_test_garage_door
            name: Open
            icon: mdi:garage-open
            variables:
              action_service: cover.open_cover
              action_requires_hold: false
