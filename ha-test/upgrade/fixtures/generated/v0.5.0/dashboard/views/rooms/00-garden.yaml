title: Garden
path: room-garden
subview: true
cards:
  # marao:generated:start
  - type: custom:marao-card
    name: Garden
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
      - background: none
      - box-shadow: none
      - padding: 0
      - margin-bottom: 20px
      grid:
      - grid-template-areas: '''n'''
      - grid-template-columns: 1fr
      name:
      - justify-self: start
      - font-weight: 800
      - font-size: 25px
  - type: grid
    columns: 1
    square: false
    cards:
    - type: custom:marao-card
      template: hc_camera_card
      entity: camera.driveway_high
      name: Driveway High
      variables:
        popup_hash: '#camera-camera-driveway-high'
        event_provider: unifiprotect
        unifi_protect_media_source: media-source://unifiprotect/nvr-1:browse:camera-1
  - type: custom:marao-popup-card
    hash: '#camera-camera-driveway-high'
    entity: camera.driveway_high
    name: Driveway High
    icon: mdi:cctv
    show_icon: true
    show_name: true
    show_state: true
    height: 780px
    max_height: 80dvh
    cards:
    - type: custom:marao-camera-events-card
      entity: camera.driveway_high
      title: Events
      event_provider: unifiprotect
      unifi_protect_media_source: media-source://unifiprotect/nvr-1:browse:camera-1
  # marao:generated:end
  # marao:custom:start
  # Add custom Lovelace cards here.
  # marao:custom:end
  # marao:generated-footer:start
  - !include '/config/dashboard/MaraoDashboard/generated-test/components/navigation/navbar.yaml'
  # marao:generated-footer:end
