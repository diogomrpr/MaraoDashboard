      entity: input_boolean.holiday_mode
      name: Scenes
      icon: mdi:palette-outline
      label: "[[[\n  const ids = ['input_boolean.holiday_mode'];\n  const active = ids.filter((id) => {\n    const state = states[id]?.state;\n    return state && !['off', 'closed', 'closing', 'unavailable', 'unknown'].includes(state);\n  }).length;\n  const t = window.MaraoDashboard?.localize || ((key, _hass, values = {}) => key === 'common.active_count' ? `${values.count} active` : 'All off');\n  return active ? t('common.active_count', hass, { count: active }) : t('common.all_off', hass);\n]]]\n"
      styles:
        icon:
        - color: var(--color-orange)
      tap_action:
        action: navigate
        navigation_path: '#overview-scenes'
        haptic: heavy
  - !include '/config/dashboard/MaraoDashboard/generated-test/components/popups/overview_lights.yaml'
  - !include '/config/dashboard/MaraoDashboard/generated-test/components/popups/overview_blinds.yaml'
  - !include '/config/dashboard/MaraoDashboard/generated-test/components/popups/overview_climate.yaml'
  - !include '/config/dashboard/MaraoDashboard/generated-test/components/popups/overview_scenes.yaml'
  # marao:generated:end
