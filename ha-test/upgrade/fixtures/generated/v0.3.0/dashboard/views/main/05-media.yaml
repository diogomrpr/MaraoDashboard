          card:
          - height: 88px
          - padding: 0
          - border-radius: 30px
          - background: var(--ha-card-background)
          - box-shadow: var(--ha-card-box-shadow)
          icon:
          - width: 42px
          - color: var(--primary-text-color)
          img_cell:
