title: Media
path: media
icon: mdi:television-play
cards:
  # marao:generated:start
  - type: custom:button-card
    template: hc_media_card
    entity: media_player.living_room_tv
    name: Living Room Tv
    variables:
      popup_hash: '#media-media-player-living-room-tv'
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      template: hc_media_app_card
      entity: media_player.living_room_tv
      name: YouTube
      icon: mdi:play-box-outline
      variables:
        app_source: YouTube
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#media-media-player-living-room-tv'
    button_type: state
    entity: media_player.living_room_tv
    name: Living Room Tv
    icon: mdi:remote-tv
    show_icon: true
    show_name: true
    show_state: true
    scrolling_effect: false
    close_by_clicking_outside: true
    styles: ".bubble-pop-up,\n.bubble-pop-up-container {\n  overscroll-behavior: contain !important;\n  touch-action: pan-y !important;\n}\n.bubble-pop-up-container {\n  height: 100% !important;\n  align-items: stretch !important;\n  align-content: start !important;\n  justify-content: flex-start !important;\n}\n.bubble-pop-up {\n  position: fixed !important;\n  inset: auto 0 0 0 !important;\n  height: min(780px, 80vh) !important;\n  max-height: 80vh !important;\n  margin: 0 !important;\n  overflow-y: auto !important;\n}\n.bubble-pop-up-container > .bubble-cards-container,\n.bubble-pop-up-container > ha-sortable {\n  align-self: stretch !important;\n  margin-top: 16px !important;\n}\n"
    cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:button-card
        template: hc_media_app_card
        entity: media_player.living_room_tv
        name: YouTube
        icon: mdi:play-box-outline
        variables:
          app_source: YouTube
