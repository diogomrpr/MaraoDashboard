        entity: media_player.living_room_tv
        name: Back
        icon: mdi:arrow-u-left-top
        show_name: false
        show_state: false
        show_label: false
        tap_action:
          action: perform-action
          perform_action: remote.send_command
          target:
            entity_id: remote.living_room_tv
          haptic: heavy
          data:
            command: menu
        styles:
          grid:
          - grid-template-areas: '''i'''
          card:
          - height: 90px
          - padding: 14px 10px
          - border-radius: 28px
          - background: var(--ha-card-background)
          - box-shadow: var(--ha-card-box-shadow)
          icon:
          - width: 34px
          - color: var(--primary-text-color)
          img_cell:
          - width: 52px
          - height: 52px
          - border-radius: 50%
          - background: var(--opacity-contrast-100)
          - justify-self: center
          - align-self: center
      - type: custom:button-card
        entity: media_player.living_room_tv
        name: ''
        icon: mdi:chevron-up
        show_name: false
        show_state: false
        show_label: false
        tap_action:
