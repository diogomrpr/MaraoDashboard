title: Energy
path: energy
icon: mdi:lightning-bolt
theme: Marao Dashboard
cards:
  # marao:generated:start
  - type: custom:marao-card
    template: hc_graph_card
    entity: sensor.marao_dashboard_test_graph_history
    name: House Power
    icon: mdi:flash
    variables:
      show_graph_fill: true
      show_graph_line: true
      show_icon: true
    tap_action:
      action: navigate
      navigation_path: '#energy-house-power'
      haptic: heavy
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:marao-energy-period-card
      entity: sensor.marao_dashboard_test_month_energy
      name: Month Power
      period: month
      popup_hash: '#energy-month-power'
      popup: false
      icon: mdi:flash
    - type: custom:marao-energy-period-card
      entity: sensor.marao_dashboard_test_today_energy
      name: Today Power
      period: day
      popup_hash: '#energy-today-power'
      popup: false
      icon: mdi:flash-outline
    - type: custom:marao-energy-period-card
      entity: sensor.marao_dashboard_test_month_cost
      name: Month Cost
      period: month
      popup_hash: '#energy-month-cost'
      popup: false
      icon: mdi:currency-eur
    - type: custom:marao-energy-period-card
      entity: sensor.marao_dashboard_test_today_cost
      name: Today Cost
      period: day
      popup_hash: '#energy-today-cost'
      popup: false
      icon: mdi:cash-clock
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:marao-card
      template: hc_toggle_graph_card
      entity: sensor.marao_dashboard_test_graph_history
      name: House load
      icon: null
      variables:
        toggle_entity: switch.marao_dashboard_test_switch
  - type: custom:marao-card
    template: hc_sensor_card
    entity: sensor.marao_dashboard_test_power
    name: Solar Power
  - type: custom:marao-card
    template: hc_sensor_card
    entity: binary_sensor.marao_dashboard_test_washing_machine
    name: Washer
  - !include '/config/dashboard/MaraoDashboard/dashboard/components/popups/energy_house_power.yaml'
  - !include '/config/dashboard/MaraoDashboard/dashboard/components/popups/energy_month_power.yaml'
  - !include '/config/dashboard/MaraoDashboard/dashboard/components/popups/energy_today_power.yaml'
  - !include '/config/dashboard/MaraoDashboard/dashboard/components/popups/energy_month_cost.yaml'
  - !include '/config/dashboard/MaraoDashboard/dashboard/components/popups/energy_today_cost.yaml'
  # marao:generated:end
  # marao:custom:start
  # Add custom Lovelace cards here.
  # marao:custom:end
  # marao:generated-footer:start
  - !include '/config/dashboard/MaraoDashboard/dashboard/components/navigation/navbar.yaml'
  # marao:generated-footer:end
