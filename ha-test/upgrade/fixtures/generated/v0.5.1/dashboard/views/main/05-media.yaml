title: Media
path: media
icon: mdi:television-play
theme: Marao Dashboard
cards:
  # marao:generated:start
  - type: custom:marao-card
    template: hc_media_card
    entity: media_player.marao_dashboard_test_apple_tv
    name: Living Room Apple TV
    variables:
      popup_hash: '#media-media-player-marao-dashboard-test-apple-tv'
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:marao-card
      template: hc_media_app_card
      entity: media_player.marao_dashboard_test_apple_tv
      name: YouTube
      icon: mdi:youtube
      show_state: false
      variables:
        app_source: YouTube
    - type: custom:marao-card
      template: hc_media_app_card
      entity: media_player.marao_dashboard_test_apple_tv
      name: Plex
      icon: mdi:plex
      show_state: false
      variables:
        app_source: Plex
  - type: custom:marao-card
    template: hc_media_card
    entity: media_player.marao_dashboard_test_audio
    name: Living Room Music
    variables:
      popup_hash: '#media-media-player-marao-dashboard-test-audio'
  - type: custom:marao-popup-card
    hash: '#media-media-player-marao-dashboard-test-apple-tv'
    entity: media_player.marao_dashboard_test_apple_tv
    name: Living Room Apple TV
    icon: mdi:remote-tv
    show_icon: true
    show_name: true
    show_state: true
    height: 780px
    max_height: 80dvh
    cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:marao-card
        template: hc_media_app_card
        entity: media_player.marao_dashboard_test_apple_tv
        name: YouTube
        icon: mdi:youtube
        show_state: false
        variables:
          app_source: YouTube
      - type: custom:marao-card
        template: hc_media_app_card
        entity: media_player.marao_dashboard_test_apple_tv
        name: Plex
        icon: mdi:plex
        show_state: false
        variables:
          app_source: Plex
    - type: grid
      columns: 3
      square: false
      cards:
      - type: custom:marao-card
        entity: media_player.marao_dashboard_test_apple_tv
        name: Back
        icon: mdi:arrow-u-left-top
        show_name: false
        show_state: false
        show_label: false
        tap_action:
          action: perform-action
          perform_action: remote.send_command
          target:
            entity_id: remote.marao_dashboard_test_apple_tv
          haptic: heavy
          data:
            command: menu
        styles:
          grid:
          - grid-template-areas: '''i'''
          card:
          - height: 90px
          - padding: 14px 10px
          - border-radius: 28px
          - background: var(--ha-card-background)
          - box-shadow: var(--ha-card-box-shadow)
          icon:
          - width: 34px
          - color: var(--primary-text-color)
          img_cell:
          - width: 52px
          - height: 52px
          - border-radius: 50%
          - background: var(--opacity-contrast-100)
          - justify-self: center
          - align-self: center
      - type: custom:marao-card
        entity: media_player.marao_dashboard_test_apple_tv
        name: ''
        icon: mdi:chevron-up
        show_name: false
        show_state: false
        show_label: false
        tap_action:
          action: perform-action
          perform_action: remote.send_command
          target:
            entity_id: remote.marao_dashboard_test_apple_tv
          haptic: heavy
          data:
            command: up
        styles:
          grid:
          - grid-template-areas: '''i'''
          card:
          - height: 88px
          - padding: 0
          - border-radius: 30px
          - background: var(--ha-card-background)
          - box-shadow: var(--ha-card-box-shadow)
          icon:
          - width: 42px
          - color: var(--primary-text-color)
          img_cell:
          - width: 100%
          - height: 100%
          - border-radius: '0'
          - background: none
          - justify-self: center
          - align-self: center
        hold_action:
          action: perform-action
          perform_action: remote.send_command
          target:
            entity_id: remote.marao_dashboard_test_apple_tv
          data:
            command: up
            hold_secs: 1
          haptic: heavy
