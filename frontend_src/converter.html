<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="__MARAO_CSP__"><title>Marao JSON converter</title>
<style>__MARAO_FONT__
:root{font-family:Montserrat,system-ui,sans-serif;color:#203e63;background:#edf3fa;font-size:16px}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:auto;padding:24px 12px 48px}h1{font-size:1.6rem;overflow-wrap:anywhere}h2{font-size:1.15rem}p{line-height:1.5}label{display:block;font-weight:600;margin:16px 0 8px}textarea,input,select,button{max-width:100%;font:inherit;border:1px solid #58799e;border-radius:12px;color:inherit;background:white}textarea,input,select{width:100%;padding:12px}textarea{min-height:180px;font-family:monospace;resize:vertical}input,select,button{min-height:48px}button{padding:10px 16px;cursor:pointer;background:#c9def6;font-weight:600}button:disabled{opacity:.55;cursor:default}button:focus,input:focus,textarea:focus,select:focus{outline:none}details{padding:12px 0}summary{min-height:48px;padding:12px 0;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.question{padding:12px;background:#dce9f8;border-radius:16px;margin:12px 0}.helper{font-size:.9rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{white-space:pre-wrap;overflow-wrap:anywhere}#result[hidden],#questions[hidden]{display:none}.language{display:flex;align-items:center;gap:12px}.language select{width:auto}.result-copy{min-height:240px}@media(prefers-color-scheme:dark){:root{color:#e4eefb;background:#172435}textarea,input,select{background:#24364f}button{background:#355c87}.question{background:#243d5d}}</style></head>
<body><main><div class="language"><label for="language">Language / Idioma</label><select id="language"><option value="en">English</option><option value="pt">Português</option></select></div><h1 data-text="title"></h1><p data-text="intro"></p>
<label for="source" data-text="paste"></label><textarea id="source" spellcheck="false"></textarea>
<details><summary data-text="advanced"></summary><p class="helper" data-text="advancedHelp"></p><label for="dashboard-address" data-text="addressOptional"></label><input id="dashboard-address" placeholder="marao-dashboard"><label for="metadata" data-text="metadata"></label><textarea id="metadata" spellcheck="false"></textarea><label for="custom" data-text="custom"></label><textarea id="custom" spellcheck="false"></textarea><label for="custom-page" data-text="page"></label><input id="custom-page" placeholder="home"><label for="custom-popup" data-text="popup"></label><input id="custom-popup" placeholder="#page-home-door-popup"></details>
<div class="actions"><button id="translate" data-text="translate"></button><button id="reset" data-text="reset"></button></div><div id="questions" hidden></div><p id="status" role="status"></p><details id="error-details" hidden><summary data-text="details"></summary><pre id="error-detail-text"></pre></details>
<section id="result" hidden><h2 data-text="ready"></h2><p id="summary"></p><p id="private-review" class="helper"></p><p class="helper" data-text="visibility"></p><p class="helper" data-text="install"></p><label for="output" data-text="output"></label><textarea class="result-copy" id="output" readonly spellcheck="false"></textarea><div class="actions"><button id="copy" data-text="copy"></button><button id="download" data-text="download"></button></div></section>
<footer><p class="helper" data-text="privacy"></p><details><summary>Montserrat — SIL Open Font License</summary><pre>__MARAO_LICENSE__</pre></details></footer></main><script>__MARAO_SCRIPT__</script></body></html>
