name: HACS

on:
  push:
    paths:
      - ".github/workflows/hacs.yml"
      - "hacs.json"
      - "custom_components/**"
  pull_request:
    paths:
      - ".github/workflows/hacs.yml"
      - "hacs.json"
      - "custom_components/**"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
