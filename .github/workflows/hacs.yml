name: Validate HACS

on:
  push:
    paths:
      - ".github/workflows/hacs.yml"
      - "hacs.json"
      - "custom_components/marao_dashboard/manifest.json"
      - "custom_components/marao_dashboard/strings.json"
      - "custom_components/marao_dashboard/translations/**"
      - "custom_components/marao_dashboard/services.yaml"
      - "custom_components/marao_dashboard/config_flow.py"
      - "custom_components/marao_dashboard/__init__.py"
  pull_request:
    paths:
      - ".github/workflows/hacs.yml"
      - "hacs.json"
      - "custom_components/marao_dashboard/manifest.json"
      - "custom_components/marao_dashboard/strings.json"
      - "custom_components/marao_dashboard/translations/**"
      - "custom_components/marao_dashboard/services.yaml"
      - "custom_components/marao_dashboard/config_flow.py"
      - "custom_components/marao_dashboard/__init__.py"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
