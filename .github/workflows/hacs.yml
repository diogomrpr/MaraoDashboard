name: Validate HACS

on:
  push:
    paths:
      - ".github/workflows/hacs.yml"
      - "hacs.json"
      - "dist/**"
  pull_request:
    paths:
      - ".github/workflows/hacs.yml"
      - "hacs.json"
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS Dashboard validation
        uses: hacs/action@main
        with:
          category: plugin
          comment: false
