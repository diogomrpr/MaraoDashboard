name: Tests

on:
  push:
    paths:
      - ".github/workflows/tests.yml"
      - "custom_components/**"
      - "frontend_src/**"
      - "ha-test/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/tests.yml"
      - "custom_components/**"
      - "frontend_src/**"
      - "ha-test/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      full:
        description: Run comprehensive offline tests
        type: boolean
        default: false
      parallel:
        description: Allow independent checks in parallel
        type: boolean
        default: false
      components:
        description: Reviewed changed components, separated by commas
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run affected unit tests (full and parallel are explicit options)
        env:
          GH_TOKEN: ${{ github.token }}
          MARAO_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
          MARAO_PARALLEL: ${{ github.event_name == 'workflow_dispatch' && inputs.parallel }}
          MARAO_COMPONENTS: ${{ inputs.components }}
          MARAO_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MARAO_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--offline --head "$MARAO_HEAD")
          if [[ -n "$MARAO_BASE" && ! "$MARAO_BASE" =~ ^0+$ ]]; then
            args+=(--base "$MARAO_BASE")
          else
            args+=(--release)
          fi
          if [[ -n "$MARAO_COMPONENTS" ]]; then args+=(--component "$MARAO_COMPONENTS"); fi
          if [[ "$MARAO_FULL" == "true" ]]; then args+=(--full); else args+=(--unit); fi
          if [[ "$MARAO_PARALLEL" == "true" ]]; then args+=(--parallel); fi
          node tests/verification.js "${args[@]}" --plan > "$RUNNER_TEMP/marao-affected-plan.json"
          if node -e 'const p=require(process.argv[1]);process.exit(p.checks.some(c=>c.command.some(a=>/^tests\/test-.+-local\.js$/.test(a)))?0:1)' "$RUNNER_TEMP/marao-affected-plan.json"; then
            npx playwright install --with-deps chromium webkit
          fi
          node tests/verification.js "${args[@]}"
