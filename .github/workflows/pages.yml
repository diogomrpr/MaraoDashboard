name: Documentation

on:
  pull_request:
    paths: ['docs/**', 'frontend_src/**', 'custom_components/marao_dashboard/frontend/**', 'tests/docs/**', 'package*.json', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'frontend_src/**', 'custom_components/marao_dashboard/frontend/**', 'tests/docs/**', 'package*.json', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing latest stable release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Publish tagged documentation from the protected main branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f "release_tag=$RELEASE_TAG"
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check publication target
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            LATEST_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            test "$REQUESTED_TAG" = "$LATEST_TAG"
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - run: npm ci
      - run: npm ci --prefix docs
      - run: npm run docs:test
      - run: npm run docs:build
        env:
          MARAO_DOCS_RELEASE: ${{ steps.release.outputs.tag }}
      - uses: actions/upload-pages-artifact@v5
        if: steps.release.outputs.publish == 'true'
        with:
          path: docs/dist
  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
